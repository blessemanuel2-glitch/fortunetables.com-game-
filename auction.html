<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fortune Tables Auction</title><link rel="stylesheet" href="style.css"><style>*{box-sizing:border-box}body{margin:0;background:#030303;color:#fff}.wrap{width:min(1050px,94%);margin:30px auto}.hero{border:1px solid #d4af37;background:radial-gradient(circle at 80% 0,#52112e,#090909 45%,#030303);padding:24px;border-radius:14px}.gold{color:#d4af37}.pink{color:#ff2d7a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}.card{border:1px solid #59491e;background:#090909;padding:15px;border-radius:12px}.auction{border-color:#ff2d7a;box-shadow:0 0 20px #ff2d7a22}.price{font-size:30px;color:#d4af37;font-family:Georgia,serif}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.banker{border:1px solid #d4af37;padding:15px;margin:15px 0;background:#0b0904}.small{font-size:12px;color:#bbb}</style></head><body><main class="wrap"><section class="hero"><h1 style="font-family:Georgia,serif;margin:0">♛ FORTUNE AUCTIONS</h1><p class="pink">BANKER DISCOUNTS A BANK-OWNED PROPERTY. PLAYERS BID. HIGHEST BID WINS WHEN THE BANKER CLOSES IT.</p><div class="row"><button onclick="location.href='properties.html'">🏠 PROPERTY LIST</button><button class="secondary" onclick="goBack()">BACK</button></div></section><section id="bankerPanel" class="banker" style="display:none"><h2>START A CHEAPER PROPERTY AUCTION</h2><div class="grid"><select id="auctionProperty"></select><input id="startingPrice" type="number" min="0" placeholder="CHEAPER START PRICE"><button onclick="startAuction()">🔨 START AUCTION</button></div><p class="small">The starting auction price must be lower than the property's normal list price.</p></section><h2>LIVE AUCTIONS</h2><div id="auctions" class="grid">Loading...</div><p id="message"></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://clxyekczujdcfhfpbnoo.supabase.co','sb_publishable_92NFR3gxbBtioyNE9UFGmw_9c28SVKZ');const bankerToken=localStorage.getItem('ft_banker_token'),playerToken=localStorage.getItem('ft_player_token'),isBanker=!!bankerToken,token=bankerToken||playerToken;let catalog=[];function goBack(){location.href=isBanker?'banker.html':'player.html'}async function load(){if(!token){location.href='index.html';return}bankerPanel.style.display=isBanker?'block':'none';if(isBanker){const c=await db.rpc('ft_get_property_catalog',{p_session_token:bankerToken});catalog=(c.data||[]).filter(p=>p.is_for_sale);auctionProperty.innerHTML=catalog.map(p=>`<option value="${p.property_id}" data-price="${p.price}">${p.property_name} — LIST ${p.price}</option>`).join('')}const r=await db.rpc('ft_get_property_auctions',{p_session_token:token});if(r.error){message.textContent=r.error.message;return}render(r.data||[])}function render(list){auctions.innerHTML=list.length?list.map(a=>`<article class="card auction"><div class="pink">LIVE AUCTION</div><h3>${a.property_name}</h3><div class="small">LIST PRICE ${a.list_price} TABLES</div><div>STARTED AT <b>${a.starting_price}</b></div><div class="price">${a.current_bid||a.starting_price} TABLES</div><div class="small">${a.highest_bidder_name?'HIGH BIDDER: '+a.highest_bidder_name:'NO BIDS YET'}</div>${!isBanker?`<input id="bid${a.auction_id}" type="number" min="${a.current_bid>0?a.current_bid+1:a.starting_price}" placeholder="YOUR BID"><button onclick="bid(${a.auction_id})">PLACE BID</button>`:`<div class="row"><button onclick="closeAuction(${a.auction_id},true)">🔨 SELL TO HIGH BIDDER</button><button class="secondary" onclick="closeAuction(${a.auction_id},false)">CANCEL</button></div>`}</article>`).join(''):'<p>No live auctions right now.</p>'}async function startAuction(){const id=Number(auctionProperty.value),amount=Number(startingPrice.value);const p=catalog.find(x=>x.property_id===id);if(!p)return;if(!(amount>=0&&amount<p.price)){message.textContent=`Auction price must be cheaper than ${p.price} TABLES.`;return}const r=await db.rpc('ft_banker_start_property_auction',{p_banker_token:bankerToken,p_property_id:id,p_starting_price:amount});message.textContent=r.error?r.error.message:`AUCTION STARTED AT ${amount} TABLES.`;if(!r.error)load()}async function bid(id){const amount=Number(document.getElementById('bid'+id).value);const r=await db.rpc('ft_player_bid_property_auction',{p_player_token:playerToken,p_auction_id:id,p_amount:amount});message.textContent=r.error?r.error.message:`BID PLACED: ${amount} TABLES.`;if(!r.error)load()}async function closeAuction(id,sell){if(!confirm(sell?'Sell this property to the current highest bidder?':'Cancel this auction?'))return;const r=await db.rpc('ft_banker_close_property_auction',{p_banker_token:bankerToken,p_auction_id:id,p_sell:sell});message.textContent=r.error?r.error.message:r.data;if(!r.error)load()}load();setInterval(load,4000);</script></body></html>
