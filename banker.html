<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fortune Tables Banker</title><link rel="stylesheet" href="style.css"><style>.wide{width:min(950px,100%)}.player-card{border:1px solid #59491e;padding:18px;margin:12px 0;background:#090909}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}.mini{padding:10px;font-size:12px}.section{border-top:1px solid #59491e;margin-top:22px;padding-top:18px}.history{text-align:left;font-size:13px;max-height:300px;overflow:auto}.stat{color:#d4af37;font-family:Georgia,serif;font-size:18px}.topnav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.danger{background:#7b102e}</style></head><body><main class="landing"><div class="crown">♛</div><h1 style="font-size:52px">FORTUNE</h1><h2>BANKER</h2><p id="tableLabel" class="tagline"></p><section class="panel wide"><div class="topnav"><button onclick="location.href='properties.html'">🏛 PROPERTY LIST</button><button onclick="location.href='properties.html'">🎁 AWARD FREE PROPERTY</button><button class="secondary" onclick="location.href='leaderboard.html'">♛ LEADERBOARD</button></div><p style="font-size:12px;color:#d4af37">BANKER CONTROLS PROPERTY, PENALTIES, SUPPORT & ACCOUNT FREEZES.</p><h3>BANKER DASHBOARD • UP TO 6 PLAYERS</h3><div id="players">Waiting for players...</div><div class="section"><h3>👶 ISSUE CHILD SUPPORT</h3><div class="grid"><select id="supportPayer"></select><select id="supportRecipient"><option value="">PAY TO BANK</option></select><input id="supportAmount" type="number" min="1" value="3" placeholder="AMOUNT"><input id="supportNote" value="Child support" placeholder="NOTE"><button onclick="issueSupport()">ISSUE PAYMENT</button></div><div id="supportHistory"></div></div><div class="section"><h3>TRANSFER TABLES</h3><div class="grid"><select id="from"></select><select id="to"></select><input id="transferAmount" type="number" min="1" placeholder="AMOUNT"><button onclick="transferMoney()">TRANSFER</button></div></div><div class="section"><h3>ASSIGN NEW PROPERTY</h3><div class="grid"><select id="propertyPlayer"></select><input id="propertyName" placeholder="PROPERTY NAME"><input id="propertyPrice" type="number" min="0" placeholder="PRICE"><input id="propertyRent" type="number" min="0" placeholder="RENT"><button onclick="assignProperty()">CREATE & ASSIGN</button></div><div id="properties"></div></div><div class="section"><h3>TRANSACTION HISTORY</h3><div id="history" class="history">No transactions yet.</div></div><p id="message"></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://clxyekczujdcfhfpbnoo.supabase.co','sb_publishable_92NFR3gxbBtioyNE9UFGmw_9c28SVKZ');const token=localStorage.getItem('ft_banker_token');const msg=document.getElementById('message');document.getElementById('tableLabel').textContent='TABLE: '+(localStorage.getItem('ft_table_code')||'');let players=[];function opts(){const html=players.map(p=>`<option value="${p.player_id}">${p.player_name}</option>`).join('');['from','to','propertyPlayer','supportPayer'].forEach(id=>document.getElementById(id).innerHTML=html);supportRecipient.innerHTML='<option value="">PAY TO BANK</option>'+html}async function load(){if(!token){location.href='index.html';return}const {data,error}=await db.rpc('ft_get_banker_state',{p_banker_token:token});if(error){msg.textContent=error.message;return}players=data||[];document.getElementById('players').innerHTML=players.length?players.map(p=>`<div class="player-card"><strong>${p.player_name}</strong> • ${p.symbol||'No symbol'}<p><span class="stat">${p.cash} TABLES</span> • Credit ${p.available_credit}/${p.credit_limit} • Debt ${p.debt}</p><div class="grid"><button class="mini" onclick="adjust(${p.player_id},1,0,0)">+1</button><button class="mini" onclick="adjust(${p.player_id},5,0,0)">+5</button><button class="mini secondary" onclick="adjust(${p.player_id},-1,0,0)">-1</button><button class="mini secondary" onclick="adjust(${p.player_id},-5,0,0)">-5</button><button class="mini" onclick="adjust(${p.player_id},0,1,1)">USE 1 CREDIT</button><button class="mini secondary" onclick="adjust(${p.player_id},0,-1,-1)">PAY 1 DEBT</button><button class="mini" onclick="setLimit(${p.player_id},${p.credit_limit})">CREDIT LIMIT</button><button class="mini danger" onclick="freezePlayer(${p.player_id},'${String(p.player_name).replace(/'/g,"\\'")}')">🔒 FREEZE / JAIL</button><button class="mini secondary" onclick="releasePlayer(${p.player_id})">🔓 RELEASE</button></div></div>`).join(''):'Waiting for players...';opts();loadHistory();loadProperties();loadSupport()}async function issueSupport(){const payer=Number(supportPayer.value),recipient=supportRecipient.value?Number(supportRecipient.value):null;if(recipient===payer){msg.textContent='Choose another player or the Bank.';return}const {error}=await db.rpc('ft_banker_issue_child_support',{p_banker_token:token,p_payer_player_id:payer,p_recipient_player_id:recipient,p_amount:Number(supportAmount.value),p_note:supportNote.value});msg.textContent=error?error.message:'👶 Child support payment issued.';if(!error)load()}async function loadSupport(){const {data}=await db.rpc('ft_get_banker_child_support',{p_banker_token:token});supportHistory.innerHTML=(data||[]).map(x=>`<p><b>${x.payer_name}</b> → ${x.recipient_name||'BANK'} • ${x.amount} TABLES • ${x.status.toUpperCase()}</p>`).join('')||'<p>No support orders.</p>'}async function freezePlayer(id,name){const reason=prompt(`Why is ${name} being sent to jail?`,'Scam / Steal penalty');if(reason===null)return;const fee=prompt('Release fee in TABLES:','5');if(fee===null)return;const {error}=await db.rpc('ft_banker_freeze_player',{p_banker_token:token,p_player_id:id,p_reason:reason,p_bail_amount:Number(fee)});msg.textContent=error?error.message:`🔒 ${name}'s account is FROZEN.`;if(!error)load()}async function releasePlayer(id){if(!confirm('Release this player from jail without charging them?'))return;const {error}=await db.rpc('ft_banker_release_player',{p_banker_token:token,p_player_id:id});msg.textContent=error?error.message:'🔓 Player released.';if(!error)load()}async function adjust(id,cash,credit,debt){const {error}=await db.rpc('ft_banker_adjust_finances',{p_banker_token:token,p_player_id:id,p_cash_delta:cash,p_credit_used_delta:credit,p_debt_delta:debt,p_note:'Banker dashboard'});msg.textContent=error?error.message:'';if(!error)load()}async function setLimit(id,current){const n=prompt('New credit limit:',current);if(n===null)return;const {error}=await db.rpc('ft_banker_set_credit_limit',{p_banker_token:token,p_player_id:id,p_new_limit:Number(n)});msg.textContent=error?error.message:'';if(!error)load()}async function transferMoney(){const {error}=await db.rpc('ft_banker_transfer',{p_banker_token:token,p_from_player_id:Number(from.value),p_to_player_id:Number(to.value),p_amount:Number(transferAmount.value),p_note:'Banker-approved transfer'});msg.textContent=error?error.message:'Transfer complete.';if(!error){transferAmount.value='';load()}}async function assignProperty(){const {error}=await db.rpc('ft_banker_assign_property',{p_banker_token:token,p_player_id:Number(propertyPlayer.value),p_property_name:propertyName.value,p_price:Number(propertyPrice.value||0),p_rent:Number(propertyRent.value||0)});msg.textContent=error?error.message:'Property assigned.';if(!error){propertyName.value='';propertyPrice.value='';propertyRent.value='';load()}}async function loadHistory(){const {data}=await db.rpc('ft_get_banker_transactions',{p_banker_token:token,p_limit:25});history.innerHTML=(data||[]).map(t=>`<p><b>${t.player_name||'Game'}</b> • ${t.type} • ${t.cash_delta>0?'+':''}${t.cash_delta} TABLES<br><small>${t.note||''}</small></p>`).join('')||'No transactions yet.'}async function loadProperties(){const {data}=await db.rpc('ft_get_banker_properties',{p_banker_token:token});properties.innerHTML=(data||[]).map(p=>`<p>${p.property_name} → <b>${p.owner_name}</b> • ${p.price} TABLES • Rent ${p.rent}</p>`).join('')}load();setInterval(load,4000);</script></body></html>
