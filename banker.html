<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fortune Tables Banker</title><link rel="stylesheet" href="style.css"></head><body><main class="landing"><div class="crown">♛</div><h1 style="font-size:52px">FORTUNE</h1><h2>BANKER</h2><p id="tableLabel" class="tagline"></p><section class="panel"><h3>BANKER DASHBOARD</h3><div id="players">Waiting for players...</div><p id="message"></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://clxyekczujdcfhfpbnoo.supabase.co','sb_publishable_92NFR3gxbBtioyNE9UFGmw_9c28SVKZ');const token=localStorage.getItem('ft_banker_token');document.getElementById('tableLabel').textContent='TABLE: '+(localStorage.getItem('ft_table_code')||'');async function load(){if(!token){location.href='index.html';return}const {data,error}=await db.rpc('ft_get_banker_state',{p_banker_token:token});if(error){document.getElementById('message').textContent=error.message;return}document.getElementById('players').innerHTML=data.length?data.map(p=>`<div style="border-top:1px solid #59491e;padding:15px 0"><strong>${p.player_name}</strong> — ${p.symbol||''}<p>${p.cash} TABLES | Credit ${p.available_credit}/${p.credit_limit} | Debt ${p.debt}</p><button onclick="adjust(${p.player_id},1)">+1 TABLE</button><button class="secondary" onclick="adjust(${p.player_id},-1)">-1 TABLE</button></div>`).join(''):'Waiting for players...'}async function adjust(id,amount){const {error}=await db.rpc('ft_banker_adjust_finances',{p_banker_token:token,p_player_id:id,p_cash_delta:amount,p_credit_used_delta:0,p_debt_delta:0,p_note:amount>0?'Banker collected':'Banker deducted'});if(error)document.getElementById('message').textContent=error.message;else load()}load();setInterval(load,3000);</script></body></html>
