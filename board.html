<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fortune Tables Digital Board</title><link rel="stylesheet" href="style.css"><style>*{box-sizing:border-box}body{margin:0;background:#020202;color:#fff}.wrap{min-height:100vh;padding:18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:auto;max-width:1180px}.brand{font-family:Georgia,serif;color:#d4af37;font-size:28px}.brand span,.pink{color:#ff2d7a}.gold{color:#d4af37}.code{border:1px solid #59491e;padding:10px 14px}.layout{max-width:1180px;margin:16px auto;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px}.board{aspect-ratio:1;position:relative;border:3px solid #d4af37;background:radial-gradient(circle at center,#2e0820 0,#0a0808 31%,#020202 72%);overflow:hidden}.center{position:absolute;inset:25%;border:1px solid #ff2d7a;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:#050505dd}.center h1{margin:0;color:#d4af37;font-family:Georgia,serif;font-size:clamp(28px,5vw,66px)}.center h2{margin:0;color:#ff2d7a;font-size:clamp(20px,4vw,46px)}.turn{padding:9px;border:1px solid #ff2d7a;background:#210813;margin-top:10px;font-weight:bold}.space{position:absolute;width:11.111%;height:11.111%;border:1px solid #5d4816;background:#090909;display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(6px,.9vw,11px);padding:3px;line-height:1.05}.space.steal{border:2px solid #ff2d7a;background:#290711;color:#ff9cbd;font-weight:800}.space.jackpot{border:2px solid #d4af37;background:#2b2102;color:#ffe28a;font-weight:800}.space.confession{border:2px solid #ff2d7a;background:#210815;color:#ffd3e3;font-weight:800}.space.market_crash{border:2px solid #8d55ff;background:#160c27;color:#c9b0ff;font-weight:800}.token{position:absolute;z-index:10;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:18px;background:#111;border:2px solid #fff;box-shadow:0 0 16px #ff2d7a;transition:.35s}.side{border:1px solid #59491e;background:#070707;padding:16px}.roll{font-size:24px;min-height:58px;width:100%}.roll:disabled{opacity:.35}.dice{font-size:70px;text-align:center}.player{border-bottom:1px solid #33270a;padding:8px}.note{font-size:12px;opacity:.7}.back{margin-top:10px;width:100%}.chatbox{margin-top:15px;border-top:1px solid #59491e;padding-top:10px}.chatlog{height:160px;overflow:auto;border:1px solid #3f3210;background:#040404;padding:7px}.bubble{border:1px solid #59491e;padding:6px;margin:5px 0}.bubble.me{border-color:#ff2d7a}.who{font-size:10px;color:#d4af37}.send{display:grid;grid-template-columns:1fr auto;gap:5px;margin-top:6px}.eventOverlay{position:fixed;inset:0;background:#000d;z-index:100;display:none;place-items:center;padding:20px}.eventCard{width:min(480px,100%);padding:30px;text-align:center;border:3px solid #d4af37;background:radial-gradient(circle,#3a0b28,#070707 65%);box-shadow:0 0 70px #ff2d7a66;border-radius:18px}.eventIcon{font-size:75px}.eventCard h1{font-family:Georgia,serif;color:#d4af37}.eventCard.chaos,.eventCard.steal,.eventCard.confession{border-color:#ff2d7a}.eventCard.property,.eventCard.jackpot{border-color:#d4af37}.eventCard.market_crash{border-color:#8d55ff;box-shadow:0 0 70px #8d55ff55}@media(max-width:820px){.layout{grid-template-columns:1fr}.side{order:-1}.wrap{padding:9px}.token{width:25px;height:25px;font-size:14px}.space{font-size:5.5px}.center{inset:27%}}</style></head><body><div id="eventOverlay" class="eventOverlay"><div id="eventCard" class="eventCard"><div id="eventIcon" class="eventIcon">♛</div><h1 id="eventTitle">FORTUNE</h1><p id="eventBody"></p><p id="eventMoney" class="gold"></p><div id="eventActions"></div><button class="secondary" onclick="eventOverlay.style.display='none'">CONTINUE</button></div></div><div class="wrap"><div class="top"><div class="brand">FORTUNE <span>TABLES</span> • DIGITAL BOARD</div><div class="code">GAME: <b id="tableCode" class="pink">—</b></div></div><div class="layout"><div id="board" class="board"><div class="center"><div>♛</div><h1>FORTUNE</h1><h2>TABLES</h2><div id="turnBanner" class="turn">LOADING TURN...</div></div></div><aside class="side"><h3 class="gold">LIVE GAME</h3><div id="dice" class="dice">⚄</div><button id="rollBtn" class="roll" onclick="rollDice()">🎲 ROLL DICE</button><p id="message" class="pink"></p><h3>PLAYERS</h3><div id="players">Loading...</div><p class="note">Turns rotate automatically. Land on STEAL, JACKPOT, CONFESSION or MARKET CRASH to open that deck.</p><div class="chatbox"><h3>💬 LIVE TABLE CHAT</h3><div id="chatlog" class="chatlog"></div><div class="send"><input id="chatInput" maxlength="280" placeholder="Talk your mess..."><button onclick="sendMessage()">SEND</button></div></div><button class="secondary back" onclick="goBack()">BACK TO DASHBOARD</button></aside></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://clxyekczujdcfhfpbnoo.supabase.co','sb_publishable_92NFR3gxbBtioyNE9UFGmw_9c28SVKZ'),playerToken=localStorage.getItem('ft_player_token'),bankerToken=localStorage.getItem('ft_banker_token'),token=playerToken||bankerToken;const names=['START','CROWN TAX','VELVET LOFT','FORTUNE','PINK ROOM','STEAL','PAY RENT','GOLD MARKET','CHAOS','MARBLE MANOR','BONUS','MIDNIGHT CLUB','CONFESSION','CHILD SUPPORT','DIAMOND ESTATE','FORTUNE','VIP LOUNGE','BANK FEE','ROYAL PALACE','MARKET CRASH','CHAOS','FORTUNE BOUTIQUE','PAY RENT','FANTASY HOTEL','JACKPOT','BONUS','GOLD TOWER','FORTUNE','PRIVATE MARINA','JAIL','LUXURY YACHT CLUB','WEALTH'],icons={Crown:'♛',Lips:'💋',Diamond:'💎',Snake:'🐍'},esc=s=>String(s??'').replace(/[&<>'\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]));let spaces=[],lastChat=0;function typeFor(i){if(i===5)return'steal';if(i===12)return'confession';if(i===19)return'market_crash';if(i===24)return'jackpot';return''}function build(){for(let i=0;i<32;i++){let s=document.createElement('div');s.className='space '+typeFor(i);s.textContent=names[i];board.appendChild(s);spaces.push(s)}const c=[];for(let i=0;i<9;i++)c.push([i*(100/9),100-(100/9)]);for(let i=1;i<8;i++)c.push([100-(100/9),100-(100/9)-i*(100/9)]);for(let i=8;i>=0;i--)c.push([i*(100/9),0]);for(let i=1;i<8;i++)c.push([0,i*(100/9)]);spaces.forEach((s,i)=>{s.style.left=c[i][0]+'%';s.style.top=c[i][1]+'%'})}async function load(){if(!token){location.href='index.html';return}const [{data:ps},{data:ts}]=await Promise.all([db.rpc('ft_get_board_state',{p_session_token:token}),db.rpc('ft_get_turn_state',{p_session_token:token})]);const turn=Array.isArray(ts)?ts[0]:ts;if(ps?.[0])tableCode.textContent=ps[0].table_code;renderTokens(ps||[]);players.innerHTML=(ps||[]).map(p=>`<div class="player"><b>${icons[p.symbol]||'●'} ${esc(p.player_name)}</b> • SPACE ${p.board_position}</div>`).join('');if(turn){turnBanner.textContent=`TURN ${turn.turn_number} • ${turn.current_player_name||'WAITING'}`;rollBtn.disabled=!playerToken||!turn.is_my_turn;rollBtn.textContent=turn.is_my_turn?'🎲 ROLL DICE':`⏳ ${turn.current_player_name||'WAIT'}'S TURN`}}function renderTokens(ps){document.querySelectorAll('.token').forEach(x=>x.remove());ps.forEach((p,j)=>{const s=spaces[p.board_position%32];if(!s)return;let t=document.createElement('div');t.className='token';t.textContent=icons[p.symbol]||'●';t.title=p.player_name;t.style.left=`calc(${s.style.left} + ${(j%3)*8+4}px)`;t.style.top=`calc(${s.style.top} + ${Math.floor(j/3)*8+4}px)`;board.appendChild(t)})}async function rollDice(){rollBtn.disabled=true;message.textContent='ROLLING...';const {data,error}=await db.rpc('ft_roll_board_dice',{p_player_token:playerToken});if(error){message.textContent=error.message;await load();return}const r=Array.isArray(data)?data[0]:data;dice.textContent=['⚀','⚁','⚂','⚃','⚄','⚅'][r.roll-1];message.textContent=`ROLLED ${r.roll} • ${names[r.new_position]} • NEXT: ${r.next_player_name||'—'}`;showEvent(r);await load()}function showEvent(r){if(!r||r.event_type==='none')return;const map={fortune:'🔮',chaos:'🐍',bonus:'💰',fee:'🏦',jail:'🔒',wealth:'💎',property:'🏠',rent:'💸',child_support:'👶',steal:'🕶',jackpot:'🎰',confession:'💋',market_crash:'📉'};eventIcon.textContent=map[r.event_type]||'♛';eventTitle.textContent=r.event_title;eventBody.textContent=r.event_body;eventMoney.textContent=r.cash_delta?`${r.cash_delta>0?'+':''}${r.cash_delta} TABLES`:'';eventCard.className='eventCard '+r.event_type;const links={property:['OPEN PROPERTIES','properties.html'],rent:['PAY / CHECK RENT','rent.html'],steal:['DRAW STEAL CARD','theft.html'],jackpot:['DRAW JACKPOT CODE','hijack.html'],confession:['DRAW CONFESSION','confession.html'],market_crash:['DRAW MARKET CRASH','market-crash.html']};const a=links[r.event_type];eventActions.innerHTML=a?`<button onclick="location.href='${a[1]}'">${a[0]}</button>`:'';eventOverlay.style.display='grid'}async function loadChat(){const {data}=await db.rpc('ft_get_chat_messages',{p_session_token:token,p_limit:25});const rows=data||[];chatlog.innerHTML=rows.map(r=>`<div class="bubble ${r.is_me?'me':''}"><div class="who">${esc(r.sender_name)}</div>${esc(r.message)}</div>`).join('');if(rows.length!==lastChat){chatlog.scrollTop=chatlog.scrollHeight;lastChat=rows.length}}async function sendMessage(){let text=chatInput.value.trim();if(!text)return;await db.rpc('ft_send_chat_message',{p_session_token:token,p_message:text});chatInput.value='';loadChat()}chatInput.addEventListener('keydown',e=>{if(e.key==='Enter')sendMessage()});function goBack(){location.href=bankerToken&&!playerToken?'banker.html':'player.html'}build();load();loadChat();setInterval(load,1800);setInterval(loadChat,1500);</script></body></html>
