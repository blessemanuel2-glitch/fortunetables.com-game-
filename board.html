<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fortune Tables Digital Board</title><link rel="stylesheet" href="style.css"><style>*{box-sizing:border-box}body{margin:0;background:#020202;color:#fff}.wrap{min-height:100vh;padding:18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:auto;max-width:1180px}.brand{font-family:Georgia,serif;color:#d4af37;font-size:28px}.brand span{color:#ff2d7a}.code{border:1px solid #59491e;padding:10px 14px}.layout{max-width:1180px;margin:16px auto;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px}.board{aspect-ratio:1/1;position:relative;border:3px solid #d4af37;background:radial-gradient(circle at center,#2e0820 0,#0a0808 31%,#020202 72%);box-shadow:0 0 45px #ff2d7a22,inset 0 0 55px #d4af3718;overflow:hidden}.center{position:absolute;inset:27%;border:1px solid #ff2d7a;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:#050505cc}.center h1{margin:0;color:#d4af37;font-family:Georgia,serif;font-size:clamp(28px,5vw,66px)}.center h2{margin:0;color:#ff2d7a;font-size:clamp(20px,4vw,46px)}.space{position:absolute;width:12.5%;height:12.5%;border:1px solid #5d4816;background:#090909;display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(7px,1vw,12px);padding:3px;overflow:hidden}.space:nth-child(4n+1){border-color:#ff2d7a}.space:nth-child(4n+2){border-color:#d4af37}.token{position:absolute;z-index:10;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:18px;background:#111;border:2px solid #fff;box-shadow:0 0 16px #ff2d7a;transition:.35s}.side{border:1px solid #59491e;background:#070707;padding:16px}.side h3{color:#d4af37}.roll{font-size:24px;min-height:58px;width:100%}.dice{font-size:70px;text-align:center;margin:12px 0}.player{border-bottom:1px solid #33270a;padding:10px 0}.pink{color:#ff2d7a}.gold{color:#d4af37}.note{font-size:12px;opacity:.7}.back{margin-top:10px;width:100%}.chatbox{margin-top:18px;border-top:1px solid #59491e;padding-top:14px}.chatlog{height:220px;overflow:auto;border:1px solid #3f3210;background:#040404;padding:8px;border-radius:8px}.bubble{border:1px solid #59491e;padding:7px 8px;margin:6px 0;border-radius:8px;background:#0b0905}.bubble.me{border-color:#ff2d7a;background:#210813}.who{font-size:11px;color:#d4af37}.time{font-size:9px;opacity:.55}.send{display:grid;grid-template-columns:1fr auto;gap:6px;margin-top:7px}.send input{margin:0}.send button{padding:10px 12px}@media(max-width:820px){.layout{grid-template-columns:1fr}.side{order:-1}.top{align-items:flex-start;flex-direction:column}.wrap{padding:10px}.token{width:25px;height:25px;font-size:14px}.space{font-size:6px}.center{inset:28%}.chatlog{height:180px}}</style></head><body><div class="wrap"><div class="top"><div class="brand">FORTUNE <span>TABLES</span> • DIGITAL BOARD</div><div class="code">GAME: <b id="tableCode" class="pink">—</b></div></div><div class="layout"><div id="board" class="board"><div class="center"><div>♛</div><h1>FORTUNE</h1><h2>TABLES</h2><p>ROLL. MOVE. RUN THE TABLE.</p></div></div><aside class="side"><h3>LIVE GAME</h3><div id="dice" class="dice">⚄</div><button id="rollBtn" class="roll" onclick="rollDice()">🎲 ROLL DICE</button><p id="message" class="pink"></p><h3>PLAYERS</h3><div id="players">Loading...</div><p class="note">Everyone in the same game sees the same board. Player pieces update automatically every few seconds.</p><div class="chatbox"><h3>💬 LIVE TABLE CHAT</h3><div id="chatlog" class="chatlog">Loading chat...</div><div class="send"><input id="chatInput" maxlength="280" placeholder="Talk your mess..."><button onclick="sendMessage()">SEND</button></div><button class="secondary back" onclick="location.href='chat.html'">OPEN FULL CHAT</button></div><button class="secondary back" onclick="goBack()">BACK TO DASHBOARD</button></aside></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://clxyekczujdcfhfpbnoo.supabase.co','sb_publishable_92NFR3gxbBtioyNE9UFGmw_9c28SVKZ');const playerToken=localStorage.getItem('ft_player_token'),bankerToken=localStorage.getItem('ft_banker_token'),token=playerToken||bankerToken;const names=['START','CROWN TAX','VELVET LOFT','FORTUNE','PINK ROOM','PAY RENT','GOLD MARKET','CHAOS','MARBLE MANOR','BONUS','MIDNIGHT CLUB','CHILD SUPPORT','DIAMOND ESTATE','FORTUNE','VIP LOUNGE','BANK FEE','ROYAL PALACE','CHAOS','FORTUNE BOUTIQUE','PAY RENT','FANTASY HOTEL','BONUS','GOLD TOWER','FORTUNE','PRIVATE MARINA','JAIL','LUXURY YACHT CLUB','WEALTH'];const icons={Crown:'♛',Lips:'💋',Diamond:'💎',Snake:'🐍'};const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));let spaces=[],lastChat=0;function build(){for(let i=0;i<28;i++){const s=document.createElement('div');s.className='space';s.textContent=names[i];board.appendChild(s);spaces.push(s)}positionSpaces()}function positionSpaces(){const coords=[];for(let i=0;i<8;i++)coords.push([i*12.5,87.5]);for(let i=1;i<7;i++)coords.push([87.5,87.5-i*12.5]);for(let i=7;i>=0;i--)coords.push([i*12.5,0]);for(let i=1;i<7;i++)coords.push([0,i*12.5]);spaces.forEach((s,i)=>{s.style.left=coords[i][0]+'%';s.style.top=coords[i][1]+'%'})}async function load(){if(!token){location.href='index.html';return}const {data,error}=await db.rpc('ft_get_board_state',{p_session_token:token});if(error){message.textContent=error.message;return}const ps=data||[];if(ps[0])tableCode.textContent=ps[0].table_code;renderTokens(ps);players.innerHTML=ps.map(p=>`<div class="player"><b>${icons[p.symbol]||'●'} ${esc(p.player_name)}</b><br><span class="gold">SPACE ${p.board_position}</span>${p.last_roll?` • last roll ${p.last_roll}`:''}</div>`).join('')||'Waiting for players...';rollBtn.style.display=playerToken?'block':'none'}function renderTokens(ps){document.querySelectorAll('.token').forEach(x=>x.remove());const groups={};ps.forEach(p=>(groups[p.board_position]??=[]).push(p));Object.entries(groups).forEach(([pos,arr])=>{const s=spaces[Number(pos)];arr.forEach((p,j)=>{const t=document.createElement('div');t.className='token';t.title=p.player_name;t.textContent=icons[p.symbol]||'●';const left=parseFloat(s.style.left)+(j%3)*2.4;const top=parseFloat(s.style.top)+Math.floor(j/3)*2.4;t.style.left=`calc(${left}% + 4px)`;t.style.top=`calc(${top}% + 4px)`;board.appendChild(t)})})}async function rollDice(){rollBtn.disabled=true;message.textContent='ROLLING...';const {data,error}=await db.rpc('ft_roll_board_dice',{p_player_token:playerToken});if(error){message.textContent=error.message;rollBtn.disabled=false;return}const r=Array.isArray(data)?data[0]:data;dice.textContent=['⚀','⚁','⚂','⚃','⚄','⚅'][r.roll-1];message.textContent=`YOU ROLLED ${r.roll} • MOVED TO SPACE ${r.new_position}`;await load();setTimeout(()=>rollBtn.disabled=false,700)}async function loadChat(){const {data,error}=await db.rpc('ft_get_chat_messages',{p_session_token:token,p_limit:40});if(error)return;const rows=data||[];chatlog.innerHTML=rows.map(r=>`<div class="bubble ${r.is_me?'me':''}"><div class="who">${esc(r.sender_name)}</div><div>${esc(r.message)}</div><div class="time">${new Date(r.created_at).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}</div></div>`).join('')||'<p class="note">No messages yet.</p>';if(rows.length!==lastChat){chatlog.scrollTop=chatlog.scrollHeight;lastChat=rows.length}}async function sendMessage(){const text=chatInput.value.trim();if(!text)return;const {error}=await db.rpc('ft_send_chat_message',{p_session_token:token,p_message:text});if(error){message.textContent=error.message;return}chatInput.value='';loadChat()}chatInput.addEventListener('keydown',e=>{if(e.key==='Enter')sendMessage()});function goBack(){location.href=bankerToken&&!playerToken?'banker.html':'player.html'}build();load();loadChat();setInterval(load,2500);setInterval(loadChat,1500);</script></body></html>
