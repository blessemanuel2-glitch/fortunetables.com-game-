<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fortune Tables Live Chat</title><link rel="stylesheet" href="style.css"><style>*{box-sizing:border-box}body{margin:0;background:#020202;color:#fff}.wrap{width:min(760px,100%);margin:auto;padding:18px}.head{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid #59491e;padding-bottom:12px}.code{border:1px solid #59491e;padding:9px 12px;border-radius:8px;color:#d4af37}.chat{height:62vh;overflow:auto;border:1px solid #59491e;background:#070707;padding:14px;margin-top:14px;border-radius:12px}.bubble{max-width:82%;padding:10px 12px;margin:8px 0;border:1px solid #59491e;border-radius:12px;background:#0b0905}.bubble.me{margin-left:auto;border-color:#ff2d7a;background:#210813}.who{font-size:12px;color:#d4af37;margin-bottom:4px}.time{font-size:10px;opacity:.55;margin-top:4px}.send{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}.send input{margin:0}.pink{color:#ff2d7a}@media(max-width:600px){.head{align-items:flex-start;flex-direction:column}.chat{height:58vh}.send{grid-template-columns:1fr}.bubble{max-width:92%}}</style></head><body><main class="wrap"><div class="head"><div><h1 style="margin:0;font-family:Georgia,serif;color:#d4af37">FORTUNE <span class="pink">CHAT</span></h1><small>LIVE TABLE CHAT — SAME JOIN CODE, SAME ROOM</small></div><div id="gameCode" class="code">GAME: —</div></div><div id="chat" class="chat">Loading chat...</div><div class="send"><input id="chatInput" maxlength="280" placeholder="Talk your mess..."><button onclick="sendMessage()">SEND</button></div><p id="message"></p><button class="secondary" onclick="history.back()">BACK TO GAME</button></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://clxyekczujdcfhfpbnoo.supabase.co','sb_publishable_92NFR3gxbBtioyNE9UFGmw_9c28SVKZ');const playerToken=localStorage.getItem('ft_player_token'),bankerToken=localStorage.getItem('ft_banker_token'),token=playerToken||bankerToken;let lastCount=0;const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));async function init(){if(!token){location.href='index.html';return}if(playerToken){const {data}=await db.rpc('ft_get_player_state',{p_player_token:playerToken});const p=Array.isArray(data)?data[0]:data;if(p)gameCode.textContent='GAME: '+p.table_code}else gameCode.textContent='GAME: '+(localStorage.getItem('ft_table_code')||'BANKER');loadChat()}async function loadChat(){const {data,error}=await db.rpc('ft_get_chat_messages',{p_session_token:token,p_limit:100});if(error){message.textContent=error.message;return}const rows=data||[];chat.innerHTML=rows.map(r=>`<div class="bubble ${r.is_me?'me':''}"><div class="who">${esc(r.sender_name)}</div><div>${esc(r.message)}</div><div class="time">${new Date(r.created_at).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}</div></div>`).join('')||'<p style="opacity:.6">No messages yet. Start the table talk.</p>';if(rows.length!==lastCount){chat.scrollTop=chat.scrollHeight;lastCount=rows.length}}async function sendMessage(){const text=chatInput.value.trim();if(!text)return;const {error}=await db.rpc('ft_send_chat_message',{p_session_token:token,p_message:text});if(error){message.textContent=error.message;return}chatInput.value='';message.textContent='';loadChat()}chatInput.addEventListener('keydown',e=>{if(e.key==='Enter')sendMessage()});init();setInterval(loadChat,1500);</script></body></html>
