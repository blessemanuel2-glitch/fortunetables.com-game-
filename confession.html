<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fortune Tables // Confession</title><link rel="stylesheet" href="style.css"><style>body{margin:0;background:#020202;color:#fff}.wrap{width:min(1000px,94%);margin:28px auto}.hero{border:1px solid #ff2d7a;background:radial-gradient(circle at 80% 0,#4d0b29,#090909 50%,#020202);padding:24px;border-radius:16px}.gold{color:#d4af37}.pink{color:#ff2d7a}.small{font-size:12px;color:#bbb;line-height:1.5}.deck{margin-top:18px;border:1px solid #d4af37;background:#080808;padding:20px;border-radius:16px}.drawn{min-height:280px;display:grid;place-items:center;text-align:center;border:2px solid #ff2d7a;background:linear-gradient(155deg,#200712,#050505);border-radius:16px;padding:22px}.drawn h2{font-family:Georgia,serif;color:#ff2d7a;font-size:36px;margin:10px 0}.drawn p{font-size:18px;line-height:1.55;max-width:620px}.counter{color:#d4af37;font-weight:800}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:16px}.card{border:1px solid #ff2d7a55;background:#080808;border-radius:12px;padding:15px}.card b{color:#d4af37}.card h3{color:#ff2d7a;margin:7px 0}.library{display:none}.library.open{display:grid}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:620px){.row{grid-template-columns:1fr}.drawn h2{font-size:28px}}</style></head><body><main class="wrap"><section class="hero"><div class="pink">FORTUNE TABLES // CONFESSION DECK</div><h1 style="font-family:Georgia,serif;margin:6px 0">💋 CONFESSION</h1><p>Draw a card and answer it out loud. No lying. No skipping unless the table agrees.</p><div class="row"><button onclick="location.href='player.html'">BACK TO DASHBOARD</button><button class="secondary" onclick="toggleLibrary()">VIEW ALL 25 CARDS</button></div></section><section class="deck"><div class="counter" id="remaining">25 CARDS READY</div><div id="drawArea" class="drawn"><div><div class="gold">FORTUNE TABLES // CONFESSION</div><h2>TELL THE TRUTH</h2><p>Draw one card. Read it out loud and answer before play continues.</p><button id="drawBtn" onclick="drawCard()">DRAW CONFESSION</button></div></div><div id="library" class="library grid"></div><p id="message"></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://clxyekczujdcfhfpbnoo.supabase.co','sb_publishable_92NFR3gxbBtioyNE9UFGmw_9c28SVKZ');const token=localStorage.getItem('ft_player_token');if(!token)location.href='index.html';const cards=[['THE REAL TEA','Who at this table would you trust least with your TABLES and why?'],['BAD INVESTMENT','What is the worst money decision you have ever made?'],['SECRET FAVORITE','Which player do you secretly want to win?'],['FIRST IMPRESSION','What was your first impression of the player to your left?'],['BIGGEST FLEX','What is something you are proud of but rarely say out loud?'],['PETTY CASH','What is the pettiest reason you have ever been mad at someone?'],['TRUST FUND','Who at this table would you trust with your biggest secret?'],['RISKY BUSINESS','What is the biggest risk you have ever taken?'],['GUILTY PLEASURE','Name one harmless guilty pleasure you would normally keep quiet.'],['NO FILTER','What is one thing people often misunderstand about you?'],['POWER MOVE','When was the last time you got your way and knew exactly what you were doing?'],['BROKE BEHAVIOR','What is something cheap you refuse to spend money on?'],['SNAKE CHECK','Have you ever smiled at someone you did not like? Tell the story.'],['SOFT SPOT','What is something that instantly makes you emotional?'],['HIDDEN TALENT','What can you do that most people at this table probably do not know about?'],['CRUSHED IT','What is one moment you felt unstoppable?'],['BAD HABIT','What is one habit you know you should stop?'],['JEALOUSY TAX','What is something you have been jealous of before?'],['THE RECEIPTS','What is the funniest lie you told as a kid?'],['WHO IS MOST LIKELY','Who at this table is most likely to become rich first, and why?'],['CALL YOURSELF OUT','What is one personality flaw you know you have?'],['FORTUNE TELLER','Where do you genuinely think you will be five years from now?'],['KEEP IT 100','What is one opinion you usually keep to yourself?'],['THE APOLOGY','Who is someone you owe an apology to, even a small one?'],['FINAL CONFESSION','Say one true thing about yourself that nobody at this table would guess.']];function toggleLibrary(){library.classList.toggle('open')}function render(){library.innerHTML=cards.map((c,i)=>`<article class="card"><b>CONFESSION ${i+1}</b><h3>${c[0]}</h3><p>${c[1]}</p></article>`).join('')}async function drawCard(){drawBtn&&(drawBtn.disabled=true);const {data,error}=await db.rpc('ft_draw_confession_card',{p_player_token:token});if(error){message.textContent=error.message;drawBtn&&(drawBtn.disabled=false);return}const r=Array.isArray(data)?data[0]:data;const n=Number(r.card_no),c=cards[n-1];remaining.textContent=`${r.deck_remaining} CARDS LEFT`;drawArea.innerHTML=`<div><div class="gold">CONFESSION ${n}</div><h2>${c[0]}</h2><p>${c[1]}</p><button onclick="drawCard()">DRAW ANOTHER</button></div>`;message.textContent='ANSWER OUT LOUD BEFORE THE GAME CONTINUES.'}render();</script></body></html>
