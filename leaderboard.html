<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fortune Tables Leaderboard</title><link rel="stylesheet" href="style.css"><style>.board{width:min(720px,100%)}.leader{display:grid;grid-template-columns:55px 1fr auto;gap:12px;align-items:center;text-align:left;border:1px solid #59491e;background:#080808;padding:16px;margin:10px 0}.leader.first{border:2px solid #d4af37;box-shadow:0 0 25px #d4af3740}.rank{font-family:Georgia,serif;font-size:28px;color:#d4af37}.worth{font-family:Georgia,serif;font-size:24px;color:#ff2d7a;text-align:right}.details{font-size:12px;color:#c7b98e;margin-top:5px}.winner{color:#d4af37;letter-spacing:.12em;font-size:11px}</style></head><body><main class="landing"><div class="crown">♛</div><h1 style="font-size:52px">FORTUNE</h1><h2>LEADERBOARD</h2><p class="tagline">WHO'S RUNNING THE TABLE?</p><section class="panel board"><div id="leaders">Loading fortunes...</div><p id="message"></p><button class="secondary" onclick="history.back()">BACK TO THE TABLE</button></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://clxyekczujdcfhfpbnoo.supabase.co','sb_publishable_92NFR3gxbBtioyNE9UFGmw_9c28SVKZ');const token=localStorage.getItem('ft_banker_token')||localStorage.getItem('ft_player_token');const icons={Crown:'♛',Lips:'💋',Diamond:'♦',Snake:'🐍'};async function load(){if(!token){location.href='index.html';return}const {data,error}=await db.rpc('ft_get_leaderboard',{p_session_token:token});if(error){document.getElementById('message').textContent=error.message;return}document.getElementById('leaders').innerHTML=(data||[]).map(p=>`<div class="leader ${p.rank_no==1?'first':''}"><div class="rank">#${p.rank_no}</div><div><b>${icons[p.symbol]||'✦'} ${p.player_name}</b>${p.rank_no==1?'<div class="winner">FORTUNE LEADER</div>':''}<div class="details">${p.cash} TABLES • ${p.property_count} PROPERTIES (${p.property_value}) • ${p.debt} DEBT</div></div><div class="worth">${p.net_worth}<div class="details">NET WORTH</div></div></div>`).join('')||'Waiting for players...'}load();setInterval(load,4000);</script></body></html>
