<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fortune Tables Property Market</title><link rel="stylesheet" href="style.css"><style>.wide{width:min(800px,100%)}.card{border:1px solid #59491e;background:#080808;padding:16px;margin:12px 0;text-align:left}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}.pink{color:#ff2d7a}.gold{color:#d4af37}.section{border-top:1px solid #59491e;margin-top:22px;padding-top:18px}.round{font-size:11px;letter-spacing:.15em;color:#d4af37}</style></head><body><main class="landing"><div class="crown">♛</div><h1 style="font-size:48px">FORTUNE</h1><h2>PROPERTY MARKET</h2><p class="tagline">BUY. SELL. COUNTER. CLOSE THE DEAL.</p><section class="panel wide"><div id="myprops"></div><div class="section"><h3>DEAL ROOM</h3><div id="offers">No offers yet.</div></div><p id="message"></p><button class="secondary" onclick="location.href='player.html'">BACK TO MY FORTUNE</button></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://clxyekczujdcfhfpbnoo.supabase.co','sb_publishable_92NFR3gxbBtioyNE9UFGmw_9c28SVKZ');const token=localStorage.getItem('ft_player_token');const msg=document.getElementById('message');let rows=[];async function load(){if(!token){location.href='index.html';return}const [{data:market,error},{data:offers}]=await Promise.all([db.rpc('ft_get_property_market',{p_player_token:token}),db.rpc('ft_get_property_offers',{p_player_token:token})]);if(error){msg.textContent=error.message;return}rows=market||[];const props=[...new Map(rows.filter(r=>r.own_property_id).map(r=>[r.own_property_id,r])).values()];const people=[...new Map(rows.filter(r=>r.other_player_id).map(r=>[r.other_player_id,r.other_player_name])).entries()];document.getElementById('myprops').innerHTML='<h3>MY PROPERTIES</h3>'+(props.map(p=>`<div class="card"><b class="gold">${p.own_property_name}</b><p>Listed value: ${p.own_property_price} TABLES</p><div class="grid"><button onclick="sellBank(${p.own_property_id},'${esc(p.own_property_name)}')">SELL TO BANK (50%)</button><select id="buyer${p.own_property_id}">${people.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('')}</select><input id="price${p.own_property_id}" type="number" min="0" placeholder="YOUR PRICE"><button onclick="offer(${p.own_property_id})">MAKE DEAL</button></div></div>`).join('')||'<p>You do not own property yet.</p>');document.getElementById('offers').innerHTML=(offers||[]).map(o=>`<div class="card"><div class="round">NEGOTIATION ROUND ${o.round_no||1}</div><b>${o.property_name}</b><p>${o.seller_name} ↔ ${o.buyer_name}</p><p class="pink"><b>${o.asking_price} TABLES</b> • ${o.status.toUpperCase()}</p>${o.status==='pending'?`<div class="grid"><button onclick="respond(${o.offer_id},true)">ACCEPT DEAL</button><input id="counter${o.offer_id}" type="number" min="0" placeholder="COUNTER PRICE"><button class="secondary" onclick="counter(${o.offer_id})">COUNTEROFFER</button>${o.direction==='incoming'?`<button class="secondary" onclick="respond(${o.offer_id},false)">WALK AWAY</button>`:`<button class="secondary" onclick="cancelOffer(${o.offer_id})">CANCEL DEAL</button>`}</div>`:''}</div>`).join('')||'No offers yet.'}function esc(s){return String(s).replace(/'/g,"\\'")}async function sellBank(id,name){if(!confirm(`Sell ${name} to the bank for 50% of its listed value?`))return;const {data,error}=await db.rpc('ft_sell_property_to_bank',{p_player_token:token,p_property_id:id});msg.textContent=error?error.message:`Sold to bank for ${data?.[0]?.sale_price??0} TABLES.`;if(!error)load()}async function offer(id){const buyer=Number(document.getElementById('buyer'+id).value),price=Number(document.getElementById('price'+id).value);if(!buyer||price<0||!Number.isFinite(price)){msg.textContent='Choose a player and price.';return}const {error}=await db.rpc('ft_create_property_offer',{p_player_token:token,p_property_id:id,p_buyer_player_id:buyer,p_asking_price:price});msg.textContent=error?error.message:'Deal sent.';if(!error)load()}async function counter(id){const el=document.getElementById('counter'+id),price=Number(el.value);if(el.value===''||price<0||!Number.isFinite(price)){msg.textContent='Enter your counter price.';return}const {error}=await db.rpc('ft_counter_property_offer',{p_player_token:token,p_offer_id:id,p_counter_price:price});msg.textContent=error?error.message:`Counteroffer sent: ${price} TABLES.`;if(!error)load()}async function respond(id,accept){const {error}=await db.rpc('ft_respond_property_offer',{p_player_token:token,p_offer_id:id,p_accept:accept});msg.textContent=error?error.message:(accept?'DEAL CLOSED! Property and TABLES transferred.':'You walked away from the deal.');if(!error)load()}async function cancelOffer(id){const {error}=await db.rpc('ft_cancel_property_offer',{p_player_token:token,p_offer_id:id});msg.textContent=error?error.message:'Deal cancelled.';if(!error)load()}load();setInterval(load,5000);</script></body></html>
