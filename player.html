<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fortune Tables Player</title><link rel="stylesheet" href="style.css"><style>.section{border-top:1px solid #59491e;margin-top:20px;padding-top:15px}.history{text-align:left;font-size:13px;max-height:260px;overflow:auto}.creditbar{height:12px;border:1px solid #d4af37;margin:8px 0}.creditfill{height:100%;background:#ff2d7a}.nav{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:15px}.jail{display:none;border:2px solid #ff2d7a;padding:20px;margin-bottom:18px;background:#19040b;box-shadow:0 0 25px #ff2d7a44}.jail h2{color:#ff2d7a;font-size:30px}.locked{opacity:.3;pointer-events:none;filter:grayscale(1)}</style></head><body><main class="landing"><div class="crown">♛</div><h1 style="font-size:52px">FORTUNE</h1><h2>TABLES</h2><section class="panel"><div id="jail" class="jail"><h2>🔒 ACCOUNT FROZEN</h2><h3>YOU'RE IN FORTUNE JAIL</h3><p id="jailReason"></p><p id="bail" style="color:#d4af37;font-size:22px"></p><button onclick="payBail()">💰 PAY BANKER & GET OUT</button><p><small>Or stay in jail until the Banker releases you.</small></p></div><div id="gameControls"><div class="nav"><button onclick="location.href='rent.html'">💸 PAY RENT</button><button onclick="location.href='properties.html'">🏛 FOR SALE</button><button onclick="location.href='market.html'">🤝 DEAL ROOM</button><button class="secondary" onclick="location.href='leaderboard.html'">♛ LEADERS</button></div></div><h3 id="name">PLAYER</h3><div id="balance" style="font-family:Georgia,serif;color:#d4af37;font-size:56px">--</div><p>TABLES</p><p id="credit"></p><div class="creditbar"><div id="creditfill" class="creditfill"></div></div><p id="debt"></p><p id="symbol"></p><div class="section"><h3>MY PROPERTIES</h3><div id="properties">None yet.</div></div><div class="section"><h3>RECENT ACTIVITY</h3><div id="history" class="history">No transactions yet.</div></div><p class="tagline">YOUR FORTUNE. YOUR MOVE.</p><p id="message"></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://clxyekczujdcfhfpbnoo.supabase.co','sb_publishable_92NFR3gxbBtioyNE9UFGmw_9c28SVKZ');const token=localStorage.getItem('ft_player_token');let current=null;async function load(){if(!token){location.href='index.html';return}const {data,error}=await db.rpc('ft_get_player_state',{p_player_token:token});if(error){message.textContent=error.message;return}const p=Array.isArray(data)?data[0]:data;if(!p)return;current=p;name.textContent=p.player_name;balance.textContent=p.cash;credit.textContent=`AVAILABLE CREDIT: ${p.available_credit} / ${p.credit_limit}`;debt.textContent=`DEBT: ${p.debt} TABLES`;symbol.textContent=`${p.symbol||''} • ${p.table_code}`;creditfill.style.width=(p.credit_limit?Math.round((p.available_credit/p.credit_limit)*100):0)+'%';jail.style.display=p.is_frozen?'block':'none';gameControls.classList.toggle('locked',!!p.is_frozen);if(p.is_frozen){jailReason.textContent='REASON: '+(p.jail_reason||'Banker penalty');bail.textContent=`RELEASE FEE: ${p.bail_amount} TABLES`;}loadExtras()}async function payBail(){if(!current?.is_frozen)return;if(!confirm(`Pay ${current.bail_amount} TABLES to the Banker to leave jail?`))return;const {error}=await db.rpc('ft_player_pay_bail',{p_player_token:token});message.textContent=error?error.message:'🔓 RELEASE FEE PAID. ACCOUNT UNFROZEN.';if(!error)load()}async function loadExtras(){const [{data:props},{data:tx}]=await Promise.all([db.rpc('ft_get_player_properties',{p_player_token:token}),db.rpc('ft_get_player_transactions',{p_player_token:token,p_limit:15})]);properties.innerHTML=(props||[]).map(p=>`<p><b>${p.property_name}</b><br>${p.price} TABLES • Rent ${p.rent}</p>`).join('')||'None yet.';history.innerHTML=(tx||[]).map(t=>`<p><b>${t.type}</b> • ${t.cash_delta>0?'+':''}${t.cash_delta} TABLES ${t.credit_delta?`• credit ${t.credit_delta>0?'+':''}${t.credit_delta}`:''} ${t.debt_delta?`• debt ${t.debt_delta>0?'+':''}${t.debt_delta}`:''}<br><small>${t.note||''}</small></p>`).join('')||'No transactions yet.'}load();setInterval(load,4000);</script></body></html>
