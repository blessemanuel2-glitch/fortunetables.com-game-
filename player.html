<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fortune Tables Player</title><link rel="stylesheet" href="style.css"><style>.section{border-top:1px solid #59491e;margin-top:20px;padding-top:15px}.history{text-align:left;font-size:13px;max-height:260px;overflow:auto}.creditbar{height:12px;border:1px solid #d4af37;margin:8px 0}.creditfill{height:100%;background:#ff2d7a}</style></head><body><main class="landing"><div class="crown">♛</div><h1 style="font-size:52px">FORTUNE</h1><h2>TABLES</h2><section class="panel"><h3 id="name">PLAYER</h3><div id="balance" style="font-family:Georgia,serif;color:#d4af37;font-size:56px">--</div><p>TABLES</p><p id="credit"></p><div class="creditbar"><div id="creditfill" class="creditfill"></div></div><p id="debt"></p><p id="symbol"></p><div class="section"><h3>MY PROPERTIES</h3><div id="properties">None yet.</div></div><div class="section"><h3>RECENT ACTIVITY</h3><div id="history" class="history">No transactions yet.</div></div><p class="tagline">YOUR FORTUNE. YOUR MOVE.</p><p id="message"></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://clxyekczujdcfhfpbnoo.supabase.co','sb_publishable_92NFR3gxbBtioyNE9UFGmw_9c28SVKZ');const token=localStorage.getItem('ft_player_token');async function load(){if(!token){location.href='index.html';return}const {data,error}=await db.rpc('ft_get_player_state',{p_player_token:token});if(error){document.getElementById('message').textContent=error.message;return}const p=Array.isArray(data)?data[0]:data;if(!p)return;document.getElementById('name').textContent=p.player_name;document.getElementById('balance').textContent=p.cash;document.getElementById('credit').textContent=`AVAILABLE CREDIT: ${p.available_credit} / ${p.credit_limit}`;document.getElementById('debt').textContent=`DEBT: ${p.debt} TABLES`;document.getElementById('symbol').textContent=`${p.symbol||''} • ${p.table_code}`;document.getElementById('creditfill').style.width=(p.credit_limit?Math.round((p.available_credit/p.credit_limit)*100):0)+'%';loadExtras()}async function loadExtras(){const [{data:props},{data:tx}]=await Promise.all([db.rpc('ft_get_player_properties',{p_player_token:token}),db.rpc('ft_get_player_transactions',{p_player_token:token,p_limit:15})]);document.getElementById('properties').innerHTML=(props||[]).map(p=>`<p><b>${p.property_name}</b><br>${p.price} TABLES • Rent ${p.rent}</p>`).join('')||'None yet.';document.getElementById('history').innerHTML=(tx||[]).map(t=>`<p><b>${t.type}</b> • ${t.cash_delta>0?'+':''}${t.cash_delta} TABLES ${t.credit_delta?`• credit ${t.credit_delta>0?'+':''}${t.credit_delta}`:''} ${t.debt_delta?`• debt ${t.debt_delta>0?'+':''}${t.debt_delta}`:''}<br><small>${t.note||''}</small></p>`).join('')||'No transactions yet.'}load();setInterval(load,4000);</script></body></html>
