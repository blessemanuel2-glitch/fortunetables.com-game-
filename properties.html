<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fortune Tables Properties</title><link rel="stylesheet" href="style.css"><style>*{box-sizing:border-box}body{margin:0;background:#030303;color:#fff}.app{min-height:100vh;display:grid;grid-template-columns:220px 1fr}.side{border-right:1px solid #382b0b;background:#050505;padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-family:Georgia,serif;color:#d4af37;font-size:25px;text-align:center}.brand span{display:block;color:#ff2d7a;font-style:italic;font-size:20px}.avatar{width:74px;height:74px;border:2px solid #ff2d7a;border-radius:50%;margin:22px auto 10px;display:grid;place-items:center;font-size:34px;box-shadow:0 0 25px #ff2d7a55}.side-name{text-align:center;font-size:18px}.side-role{text-align:center;color:#ff2d7a;font-size:12px;letter-spacing:2px}.side-balance{text-align:center;color:#d4af37;margin:8px 0 22px}.menu a{display:block;color:#eee;text-decoration:none;padding:12px 13px;border-radius:8px;margin:4px 0;border:1px solid transparent}.menu a:hover,.menu a.active{background:#32101d;border-color:#ff2d7a}.content{padding:18px 22px}.topbar{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid #382b0b;padding-bottom:14px}.code{border:1px solid #59491e;padding:10px 14px;border-radius:8px}.code b{color:#ff2d7a}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.tools input{flex:1;min-width:220px}.cats{display:flex;gap:7px;flex-wrap:wrap}.cats button.active{background:#b81258}.list{display:grid;grid-template-columns:repeat(4,minmax(190px,1fr));gap:12px}.prop{border:1px solid #6f5817;background:#080808;border-radius:10px;overflow:hidden;transition:.15s}.prop:hover{transform:translateY(-2px);box-shadow:0 0 18px #ff2d7a22}.pic{height:135px;display:flex;align-items:flex-end;padding:12px;font-size:42px;position:relative;background:radial-gradient(circle at 70% 20%,#652040 0,#211021 32%,#090909 72%)}.pic.club{background:radial-gradient(circle at 60% 25%,#4b1161 0,#180d35 35%,#070707 75%)}.pic.store{background:radial-gradient(circle at 60% 25%,#5b3511 0,#17100a 35%,#070707 75%)}.pic.hotel{background:radial-gradient(circle at 60% 25%,#6a1538 0,#211011 35%,#070707 75%)}.pic.business{background:radial-gradient(circle at 60% 25%,#51410d 0,#101010 40%,#050505 75%)}.pic.luxury{background:radial-gradient(circle at 60% 25%,#184053 0,#0b1419 40%,#050505 75%)}.badge{position:absolute;top:9px;left:9px;background:#8e174b;border:1px solid #ff2d7a;padding:3px 7px;border-radius:12px;font-size:10px}.meta{padding:11px}.name{font-weight:bold;font-size:15px}.nums{display:flex;justify-content:space-between;color:#d4af37;font-size:12px;margin:8px 0}.status{font-size:11px;color:#ff2d7a;margin-bottom:9px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.actions.one{grid-template-columns:1fr}.offerrow{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px}.requests{border:1px solid #ff2d7a;padding:12px;border-radius:8px;margin:10px 0;background:#15070d}.pink{color:#ff2d7a}.gold{color:#d4af37}.empty{grid-column:1/-1;padding:40px;text-align:center;color:#aaa}@media(max-width:1100px){.list{grid-template-columns:repeat(3,minmax(180px,1fr))}}@media(max-width:900px){.app{grid-template-columns:82px 1fr}.brand{font-size:14px}.brand span,.side-name,.side-role,.side-balance,.menu .label{display:none}.avatar{width:48px;height:48px;font-size:22px}.menu a{text-align:center;padding:12px 4px}.list{grid-template-columns:repeat(2,minmax(170px,1fr))}}@media(max-width:620px){.content{padding:12px}.topbar{align-items:flex-start;flex-direction:column}.list{grid-template-columns:1fr}}</style></head><body><div class="app"><aside class="side"><div class="brand">FORTUNE<span>TABLES</span></div><div class="avatar">♛</div><div id="sideName" class="side-name">PLAYER</div><div id="sideRole" class="side-role">PLAYER</div><div id="sideBalance" class="side-balance">— TABLES</div><nav class="menu"><a href="player.html">▦ <span class="label">DASHBOARD</span></a><a class="active" href="properties.html">🏠 <span class="label">PROPERTIES / FOR SALE</span></a><a href="rent.html">💸 <span class="label">PAY RENT</span></a><a href="market.html">🤝 <span class="label">DEAL ROOM</span></a><a href="leaderboard.html">♛ <span class="label">LEADERBOARD</span></a></nav></aside><main class="content"><div class="topbar"><div><h1 style="margin:0;font-family:Georgia,serif">PROPERTIES FOR SALE</h1><div class="pink">BANK OWNED • BUY OR PUT IN AN OFFER</div></div><div class="code">GAME CODE: <b id="tableCode">—</b></div></div><div id="requests"></div><div class="tools"><input id="search" placeholder="Search properties..." oninput="render()"><div class="cats"><button class="active" data-cat="ALL" onclick="setCat(this,'ALL')">ALL</button><button data-cat="HOME" onclick="setCat(this,'HOME')">HOMES</button><button data-cat="CLUB" onclick="setCat(this,'CLUB')">CLUBS</button><button data-cat="STORE" onclick="setCat(this,'STORE')">STORES</button><button data-cat="HOTEL" onclick="setCat(this,'HOTEL')">HOTELS</button><button data-cat="BUSINESS" onclick="setCat(this,'BUSINESS')">BUSINESSES</button><button data-cat="LUXURY" onclick="setCat(this,'LUXURY')">LUXURY</button></div></div><div id="list" class="list">Loading properties...</div><p id="message"></p></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://clxyekczujdcfhfpbnoo.supabase.co','sb_publishable_92NFR3gxbBtioyNE9UFGmw_9c28SVKZ');const bankerToken=localStorage.getItem('ft_banker_token'),playerToken=localStorage.getItem('ft_player_token'),isBanker=!!bankerToken,token=isBanker?bankerToken:playerToken;let data=[],players=[],cat='ALL';function esc(s){return String(s).replace(/'/g,"\\'")}function infer(p){const n=p.property_name.toLowerCase();if(n.includes('club')||n.includes('lounge')||n.includes('room')||n.includes('afterparty')||n.includes('after hours'))return'CLUB';if(n.includes('hotel')||n.includes('resort')||n.includes('suite'))return'HOTEL';if(n.includes('boutique')||n.includes('market')||n.includes('jewel')||n.includes('store')||n.includes('beauty'))return'STORE';if(n.includes('marina')||n.includes('yacht'))return'LUXURY';if(n.includes('tower')||n.includes('label')||n.includes('fashion')||n.includes('gallery')||n.includes('restaurant')||n.includes('hq'))return'BUSINESS';return'HOME'}function icon(t){return{HOME:'🏰',CLUB:'🌃',STORE:'🛍️',HOTEL:'🏨',BUSINESS:'🏢',LUXURY:'🛥️'}[t]||'🏛️'}function setCat(el,v){cat=v;document.querySelectorAll('.cats button').forEach(b=>b.classList.remove('active'));el.classList.add('active');render()}async function load(){if(!token){location.href='index.html';return}const r=await db.rpc('ft_get_property_catalog',{p_session_token:token});if(r.error){message.textContent=r.error.message;return}data=r.data||[];if(isBanker){sideRole.textContent='BANKER';const [p,q]=await Promise.all([db.rpc('ft_get_banker_state',{p_banker_token:bankerToken}),db.rpc('ft_get_banker_property_requests',{p_banker_token:bankerToken})]);players=p.data||[];sideName.textContent='THE BANKER';renderRequests(q.data||[]);tableCode.textContent=(players[0]?.table_code)||localStorage.getItem('ft_table_code')||'—'}else{const s=await db.rpc('ft_get_player_state',{p_player_token:playerToken});const me=Array.isArray(s.data)?s.data[0]:s.data;if(me){sideName.textContent=me.player_name;sideBalance.textContent=me.cash+' TABLES';tableCode.textContent=me.table_code}}render()}function renderRequests(rs){requests.innerHTML=isBanker&&rs.length?'<h3 class="pink">PLAYER REQUESTS</h3>'+rs.map(r=>`<div class="requests"><b>${r.player_name}</b> wants <b class="gold">${r.property_name}</b> for ${r.price} TABLES. <button onclick="answer(${r.request_id},true)">APPROVE</button> <button class="secondary" onclick="answer(${r.request_id},false)">DECLINE</button></div>`).join(''):''}function render(){const q=search.value.trim().toLowerCase();const arr=data.filter(p=>p.is_for_sale).filter(p=>cat==='ALL'||infer(p)===cat).filter(p=>!q||p.property_name.toLowerCase().includes(q));list.innerHTML=arr.map(p=>{const t=infer(p);return`<article class="prop"><div class="pic ${t.toLowerCase()}"><span class="badge">${t}</span><span>${icon(t)}</span></div><div class="meta"><div class="name">${p.property_name}</div><div class="nums"><span>PRICE ${p.price}</span><span>RENT ${p.rent}</span></div><div class="status">AVAILABLE FROM BANK</div>${!isBanker?`<div class="actions"><button onclick="requestBuy(${p.property_id},'${esc(p.property_name)}',${p.price})">BUY</button><button class="secondary" onclick="focusOffer(${p.property_id})">PUT IN OFFER</button></div><div class="offerrow"><input id="offer${p.property_id}" type="number" min="1" max="${p.price}" placeholder="OFFER"><button class="secondary" onclick="makeOffer(${p.property_id},'${esc(p.property_name)}')">SEND</button></div>`:`<div class="actions one"><select id="p${p.property_id}">${players.map(x=>`<option value="${x.player_id}">${x.player_name}</option>`).join('')}</select><button onclick="issue(${p.property_id},true)">ISSUE + CHARGE</button><button class="secondary" onclick="issue(${p.property_id},false)">AWARD FREE</button></div>`}</div></article>`}).join('')||'<div class="empty">No properties match this view.</div>'}function focusOffer(id){document.getElementById('offer'+id).focus()}async function requestBuy(id,name,price){if(!confirm(`Buy request for ${name} at ${price} TABLES? Banker approval required.`))return;const r=await db.rpc('ft_request_bank_property',{p_player_token:playerToken,p_property_id:id});message.textContent=r.error?r.error.message:'BUY REQUEST SENT TO BANKER.'}async function makeOffer(id,name){const amount=Number(document.getElementById('offer'+id).value);if(!amount||amount<1){message.textContent='ENTER AN OFFER AMOUNT.';return}message.textContent=`OFFER READY: ${amount} TABLES FOR ${name}. CUSTOM OFFER BACKEND IS NOT CONNECTED YET, SO NO MONEY WAS CHARGED.`}async function answer(id,ok){const r=await db.rpc('ft_banker_respond_property_request',{p_banker_token:bankerToken,p_request_id:id,p_approve:ok});message.textContent=r.error?r.error.message:(ok?'PROPERTY APPROVED.':'REQUEST DECLINED.');if(!r.error)load()}async function issue(id,charge){const pid=Number(document.getElementById('p'+id).value);if(!pid)return;const r=await db.rpc('ft_banker_issue_property',{p_banker_token:bankerToken,p_property_id:id,p_player_id:pid,p_charge_player:charge});message.textContent=r.error?r.error.message:(charge?'PROPERTY ISSUED + PLAYER CHARGED.':'PROPERTY AWARDED FREE BY BANKER.');if(!r.error)load()}load();setInterval(load,5000);</script></body></html>
