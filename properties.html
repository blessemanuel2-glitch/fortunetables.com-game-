<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fortune Tables Properties</title><link rel="stylesheet" href="style.css"><style>*{box-sizing:border-box}body{margin:0;background:#030303;color:#fff}.app{min-height:100vh;display:grid;grid-template-columns:220px 1fr}.side{border-right:1px solid #382b0b;background:#050505;padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-family:Georgia,serif;color:#d4af37;font-size:25px;text-align:center}.brand span{display:block;color:#ff2d7a;font-style:italic;font-size:20px}.avatar{width:74px;height:74px;border:2px solid #ff2d7a;border-radius:50%;margin:22px auto 10px;display:grid;place-items:center;font-size:34px;box-shadow:0 0 25px #ff2d7a55}.side-name{text-align:center;font-size:18px}.side-role{text-align:center;color:#ff2d7a;font-size:12px;letter-spacing:2px}.side-balance{text-align:center;color:#d4af37;margin:8px 0 22px}.menu a{display:block;color:#eee;text-decoration:none;padding:12px 13px;border-radius:8px;margin:4px 0;border:1px solid transparent}.menu a:hover,.menu a.active{background:#32101d;border-color:#ff2d7a}.content{padding:18px 22px}.topbar{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid #382b0b;padding-bottom:14px}.code{border:1px solid #59491e;padding:10px 14px;border-radius:8px}.code b{color:#ff2d7a}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.tools input{flex:1;min-width:220px}.cats{display:flex;gap:7px;flex-wrap:wrap}.cats button.active{background:#b81258}.list{display:grid;grid-template-columns:repeat(4,minmax(190px,1fr));gap:12px}.prop{border:1px solid #6f5817;background:#080808;border-radius:10px;overflow:hidden;transition:.15s}.prop:hover{transform:translateY(-2px);box-shadow:0 0 22px #ff2d7a33}.pic{height:150px;position:relative;background:#090909;overflow:hidden}.pic img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .25s}.prop:hover .pic img{transform:scale(1.035)}.pic:after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.48),transparent 55%);pointer-events:none}.badge{position:absolute;z-index:2;top:9px;left:9px;background:#8e174be8;border:1px solid #ff2d7a;padding:3px 7px;border-radius:12px;font-size:10px}.viewtag{position:absolute;z-index:2;right:9px;bottom:8px;background:#000b;border:1px solid #d4af37;color:#d4af37;padding:3px 7px;border-radius:8px;font-size:9px}.meta{padding:11px}.name{font-weight:bold;font-size:15px}.nums{display:flex;justify-content:space-between;color:#d4af37;font-size:12px;margin:8px 0}.status{font-size:11px;color:#ff2d7a;margin-bottom:9px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.actions.one{grid-template-columns:1fr}.offerrow{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px}.requests{border:1px solid #ff2d7a;padding:12px;border-radius:8px;margin:10px 0;background:#15070d}.pink{color:#ff2d7a}.gold{color:#d4af37}.empty{grid-column:1/-1;padding:40px;text-align:center;color:#aaa}@media(max-width:1100px){.list{grid-template-columns:repeat(3,minmax(180px,1fr))}}@media(max-width:900px){.app{grid-template-columns:82px 1fr}.brand{font-size:14px}.brand span,.side-name,.side-role,.side-balance,.menu .label{display:none}.avatar{width:48px;height:48px;font-size:22px}.menu a{text-align:center;padding:12px 4px}.list{grid-template-columns:repeat(2,minmax(170px,1fr))}}@media(max-width:620px){.content{padding:12px}.topbar{align-items:flex-start;flex-direction:column}.list{grid-template-columns:1fr}}</style></head><body><div class="app"><aside class="side"><div class="brand">FORTUNE<span>TABLES</span></div><div class="avatar">♛</div><div id="sideName" class="side-name">PLAYER</div><div id="sideRole" class="side-role">PLAYER</div><div id="sideBalance" class="side-balance">— TABLES</div><nav class="menu"><a href="player.html">▦ <span class="label">DASHBOARD</span></a><a class="active" href="properties.html">🏠 <span class="label">PROPERTIES / FOR SALE</span></a><a href="rent.html">💸 <span class="label">PAY RENT</span></a><a href="market.html">🤝 <span class="label">DEAL ROOM</span></a><a href="leaderboard.html">♛ <span class="label">LEADERBOARD</span></a></nav></aside><main class="content"><div class="topbar"><div><h1 style="margin:0;font-family:Georgia,serif">PROPERTIES FOR SALE</h1><div class="pink">BANK OWNED • SEE THE PROPERTY • BUY OR PUT IN AN OFFER</div></div><div class="code">GAME CODE: <b id="tableCode">—</b></div></div><div id="requests"></div><div class="tools"><input id="search" placeholder="Search properties..." oninput="render()"><div class="cats"><button class="active" data-cat="ALL" onclick="setCat(this,'ALL')">ALL</button><button data-cat="HOME" onclick="setCat(this,'HOME')">HOMES</button><button data-cat="CLUB" onclick="setCat(this,'CLUB')">CLUBS</button><button data-cat="STORE" onclick="setCat(this,'STORE')">STORES</button><button data-cat="HOTEL" onclick="setCat(this,'HOTEL')">HOTELS</button><button data-cat="BUSINESS" onclick="setCat(this,'BUSINESS')">BUSINESSES</button><button data-cat="LUXURY" onclick="setCat(this,'LUXURY')">LUXURY</button></div></div><div id="list" class="list">Loading properties...</div><p id="message"></p></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://clxyekczujdcfhfpbnoo.supabase.co','sb_publishable_92NFR3gxbBtioyNE9UFGmw_9c28SVKZ');const bankerToken=localStorage.getItem('ft_banker_token'),playerToken=localStorage.getItem('ft_player_token'),isBanker=!!bankerToken,token=isBanker?bankerToken:playerToken;let data=[],players=[],cat='ALL';function esc(s){return String(s).replace(/'/g,"\\'")}function infer(p){const n=p.property_name.toLowerCase();if(n.includes('club')||n.includes('lounge')||n.includes('room')||n.includes('afterparty')||n.includes('after hours'))return'CLUB';if(n.includes('hotel')||n.includes('resort')||n.includes('suite'))return'HOTEL';if(n.includes('boutique')||n.includes('market')||n.includes('jewel')||n.includes('store')||n.includes('beauty'))return'STORE';if(n.includes('marina')||n.includes('yacht'))return'LUXURY';if(n.includes('tower')||n.includes('label')||n.includes('fashion')||n.includes('gallery')||n.includes('restaurant')||n.includes('hq'))return'BUSINESS';return'HOME'}function hash(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h}function art(p,t){const h=hash(p.property_name),pink=['#ff2d7a','#e91e63','#ff4da0'][h%3],gold=['#d4af37','#f1c85b','#b9912f'][(h>>2)%3],purple=['#35104d','#1c123f','#3c1234'][(h>>4)%3];let scene='';if(t==='HOME')scene=`<rect x="55" y="50" width="210" height="78" rx="3" fill="#100b12" stroke="${gold}" stroke-width="2"/><rect x="74" y="64" width="72" height="45" fill="#220d1e" stroke="${pink}"/><rect x="158" y="64" width="86" height="45" fill="#220d1e" stroke="${pink}"/><rect x="65" y="125" width="190" height="4" fill="${pink}"/><rect x="95" y="36" width="120" height="13" fill="#110b12" stroke="${gold}"/><circle cx="85" cy="75" r="3" fill="${gold}"/><circle cx="235" cy="77" r="3" fill="${gold}"/>`;if(t==='CLUB')scene=`<rect x="48" y="48" width="224" height="82" rx="4" fill="#100812" stroke="${pink}" stroke-width="2"/><path d="M60 112 L90 72 L120 112 L150 64 L180 112 L210 70 L250 112" fill="none" stroke="${pink}" stroke-width="3" opacity=".8"/><rect x="76" y="55" width="168" height="8" fill="${gold}" opacity=".8"/><circle cx="110" cy="88" r="14" fill="none" stroke="${gold}"/><circle cx="210" cy="88" r="14" fill="none" stroke="${gold}"/>`;if(t==='STORE')scene=`<rect x="58" y="46" width="204" height="90" rx="3" fill="#120c0a" stroke="${gold}" stroke-width="2"/><path d="M58 62 H262" stroke="${pink}" stroke-width="5"/><rect x="74" y="76" width="70" height="46" fill="#190b13" stroke="${pink}"/><rect x="155" y="76" width="88" height="46" fill="#170f08" stroke="${gold}"/><path d="M58 62 l18 -18 h168 l18 18" fill="#140a0e" stroke="${gold}"/>`;if(t==='HOTEL')scene=`<rect x="88" y="32" width="144" height="104" rx="3" fill="#100b0d" stroke="${gold}" stroke-width="2"/><path d="M88 46 L160 18 L232 46" fill="#170b12" stroke="${pink}" stroke-width="2"/><g fill="${pink}">${[0,1,2,3].map(r=>[0,1,2,3].map(c=>`<rect x="${104+c*30}" y="${56+r*18}" width="13" height="9" rx="1"/>`).join('')).join('')}</g><rect x="145" y="112" width="30" height="24" fill="#20100b" stroke="${gold}"/>`;if(t==='BUSINESS')scene=`<rect x="110" y="25" width="100" height="112" fill="#0b0d10" stroke="${gold}" stroke-width="2"/><path d="M124 132 V40 M146 132 V40 M168 132 V40 M190 132 V40" stroke="${pink}" opacity=".55"/><path d="M110 54 H210 M110 78 H210 M110 102 H210" stroke="${gold}" opacity=".55"/><rect x="35" y="86" width="60" height="51" fill="#0e0b11" stroke="${pink}"/><rect x="225" y="72" width="60" height="65" fill="#0e0b11" stroke="${pink}"/>`;if(t==='LUXURY')scene=`<path d="M40 114 Q90 98 132 108 Q180 116 275 100 L255 125 Q175 139 76 126 Z" fill="#10151a" stroke="${gold}" stroke-width="2"/><path d="M125 105 L158 63 L201 105" fill="#151017" stroke="${pink}" stroke-width="2"/><path d="M158 63 V38" stroke="${gold}" stroke-width="3"/><path d="M160 40 L218 70 L160 70 Z" fill="${pink}" opacity=".55"/><path d="M20 142 Q75 132 130 142 T240 142 T330 142" fill="none" stroke="#b72970" stroke-width="3" opacity=".65"/>`;const lights=Array.from({length:16},(_,i)=>{const x=(h*(i+3)%310)+5,y=(h*(i+7)%65)+8;return`<circle cx="${x}" cy="${y}" r="${1+(i%2)}" fill="${i%3?gold:pink}" opacity=".${4+(i%5)}"/>`}).join('');const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180"><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="${purple}"/><stop offset=".62" stop-color="#09070b"/><stop offset="1" stop-color="#020203"/></linearGradient><radialGradient id="glow"><stop stop-color="${pink}" stop-opacity=".28"/><stop offset="1" stop-color="${pink}" stop-opacity="0"/></radialGradient></defs><rect width="320" height="180" fill="url(#sky)"/><circle cx="250" cy="55" r="100" fill="url(#glow)"/>${lights}<path d="M0 138 H320 V180 H0Z" fill="#020203"/><path d="M0 145 C65 138 115 153 168 144 C225 134 270 150 320 142" fill="none" stroke="${pink}" stroke-width="2" opacity=".35"/>${scene}<path d="M0 154 H320" stroke="${gold}" opacity=".35"/><rect x="0" y="0" width="320" height="180" fill="none" stroke="${pink}" stroke-opacity=".25"/></svg>`;return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(svg)}function setCat(el,v){cat=v;document.querySelectorAll('.cats button').forEach(b=>b.classList.remove('active'));el.classList.add('active');render()}async function load(){if(!token){location.href='index.html';return}const r=await db.rpc('ft_get_property_catalog',{p_session_token:token});if(r.error){message.textContent=r.error.message;return}data=r.data||[];if(isBanker){sideRole.textContent='BANKER';const [p,q]=await Promise.all([db.rpc('ft_get_banker_state',{p_banker_token:bankerToken}),db.rpc('ft_get_banker_property_requests',{p_banker_token:bankerToken})]);players=p.data||[];sideName.textContent='THE BANKER';renderRequests(q.data||[]);tableCode.textContent=(players[0]?.table_code)||localStorage.getItem('ft_table_code')||'—'}else{const s=await db.rpc('ft_get_player_state',{p_player_token:playerToken});const me=Array.isArray(s.data)?s.data[0]:s.data;if(me){sideName.textContent=me.player_name;sideBalance.textContent=me.cash+' TABLES';tableCode.textContent=me.table_code}}render()}function renderRequests(rs){requests.innerHTML=isBanker&&rs.length?'<h3 class="pink">PLAYER REQUESTS</h3>'+rs.map(r=>`<div class="requests"><b>${r.player_name}</b> wants <b class="gold">${r.property_name}</b> for ${r.price} TABLES. <button onclick="answer(${r.request_id},true)">APPROVE</button> <button class="secondary" onclick="answer(${r.request_id},false)">DECLINE</button></div>`).join(''):''}function render(){const q=search.value.trim().toLowerCase();const arr=data.filter(p=>p.is_for_sale).filter(p=>cat==='ALL'||infer(p)===cat).filter(p=>!q||p.property_name.toLowerCase().includes(q));list.innerHTML=arr.map(p=>{const t=infer(p);return`<article class="prop"><div class="pic"><img src="${art(p,t)}" alt="${p.property_name} Fortune Tables property"><span class="badge">${t}</span><span class="viewtag">PROPERTY PREVIEW</span></div><div class="meta"><div class="name">${p.property_name}</div><div class="nums"><span>PRICE ${p.price}</span><span>RENT ${p.rent}</span></div><div class="status">AVAILABLE FROM BANK</div>${!isBanker?`<div class="actions"><button onclick="requestBuy(${p.property_id},'${esc(p.property_name)}',${p.price})">BUY</button><button class="secondary" onclick="focusOffer(${p.property_id})">PUT IN OFFER</button></div><div class="offerrow"><input id="offer${p.property_id}" type="number" min="1" max="${p.price}" placeholder="OFFER"><button class="secondary" onclick="makeOffer(${p.property_id},'${esc(p.property_name)}')">SEND</button></div>`:`<div class="actions one"><select id="p${p.property_id}">${players.map(x=>`<option value="${x.player_id}">${x.player_name}</option>`).join('')}</select><button onclick="issue(${p.property_id},true)">ISSUE + CHARGE</button><button class="secondary" onclick="issue(${p.property_id},false)">AWARD FREE</button></div>`}</div></article>`}).join('')||'<div class="empty">No properties match this view.</div>'}function focusOffer(id){document.getElementById('offer'+id).focus()}async function requestBuy(id,name,price){if(!confirm(`Buy request for ${name} at ${price} TABLES? Banker approval required.`))return;const r=await db.rpc('ft_request_bank_property',{p_player_token:playerToken,p_property_id:id});message.textContent=r.error?r.error.message:'BUY REQUEST SENT TO BANKER.'}async function makeOffer(id,name){const amount=Number(document.getElementById('offer'+id).value);if(!amount||amount<1){message.textContent='ENTER AN OFFER AMOUNT.';return}message.textContent=`OFFER READY: ${amount} TABLES FOR ${name}. CUSTOM OFFER BACKEND IS NOT CONNECTED YET, SO NO MONEY WAS CHARGED.`}async function answer(id,ok){const r=await db.rpc('ft_banker_respond_property_request',{p_banker_token:bankerToken,p_request_id:id,p_approve:ok});message.textContent=r.error?r.error.message:(ok?'PROPERTY APPROVED.':'REQUEST DECLINED.');if(!r.error)load()}async function issue(id,charge){const pid=Number(document.getElementById('p'+id).value);if(!pid)return;const r=await db.rpc('ft_banker_issue_property',{p_banker_token:bankerToken,p_property_id:id,p_player_id:pid,p_charge_player:charge});message.textContent=r.error?r.error.message:(charge?'PROPERTY ISSUED + PLAYER CHARGED.':'PROPERTY AWARDED FREE BY BANKER.');if(!r.error)load()}load();setInterval(load,5000);</script></body></html>
