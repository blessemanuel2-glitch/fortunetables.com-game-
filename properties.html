<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fortune Tables Properties</title><link rel="stylesheet" href="style.css"><style>.wide{width:min(900px,100%)}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.prop{border:1px solid #59491e;background:#080808;padding:15px;margin:10px 0;text-align:left;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.available{border-color:#d4af37}.gold{color:#d4af37}.pink{color:#ff2d7a}.small{font-size:12px}</style></head><body><main class="landing"><div class="crown">♛</div><h1 style="font-size:48px">FORTUNE</h1><h2>PROPERTY LIST</h2><p class="tagline">THE MARKET IS OPEN.</p><section class="panel wide"><div class="tabs"><button onclick="filter='sale';render()">FOR SALE</button><button class="secondary" onclick="filter='all';render()">ALL PROPERTIES</button></div><div id="list">Loading properties...</div><p id="message"></p><button class="secondary" onclick="history.back()">BACK</button></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://clxyekczujdcfhfpbnoo.supabase.co','sb_publishable_92NFR3gxbBtioyNE9UFGmw_9c28SVKZ');const bankerToken=localStorage.getItem('ft_banker_token'),playerToken=localStorage.getItem('ft_player_token'),token=bankerToken||playerToken;let data=[],filter='sale',players=[];async function load(){if(!token){location.href='index.html';return}const r=await db.rpc('ft_get_property_catalog',{p_session_token:token});if(r.error){message.textContent=r.error.message;return}data=r.data||[];if(bankerToken){const p=await db.rpc('ft_get_banker_state',{p_banker_token:bankerToken});players=p.data||[]}render()}function render(){const arr=filter==='sale'?data.filter(p=>p.is_for_sale):data;list.innerHTML=arr.map(p=>`<div class="prop ${p.is_for_sale?'available':''}"><div><b class="gold">${p.property_name}</b><div class="small">PRICE ${p.price} TABLES • RENT ${p.rent}</div><div class="${p.is_for_sale?'pink':''}">${p.is_for_sale?'FOR SALE BY BANK':'OWNED BY '+p.owner_name}</div></div><div>${p.is_for_sale&&playerToken&&!bankerToken?`<button onclick="buy(${p.property_id},'${esc(p.property_name)}',${p.price})">BUY</button>`:''}${p.is_for_sale&&bankerToken?`<select id="p${p.property_id}">${players.map(x=>`<option value="${x.player_id}">${x.player_name}</option>`).join('')}</select><button onclick="issue(${p.property_id},true)">ISSUE + CHARGE</button><button class="secondary" onclick="issue(${p.property_id},false)">AWARD FREE</button>`:''}</div></div>`).join('')||'<p>No properties in this tab.</p>'}function esc(s){return String(s).replace(/'/g,"\\'")}async function buy(id,name,price){if(!confirm(`Buy ${name} for ${price} TABLES?`))return;const r=await db.rpc('ft_player_buy_bank_property',{p_player_token:playerToken,p_property_id:id});message.textContent=r.error?r.error.message:'PROPERTY PURCHASED.';if(!r.error)load()}async function issue(id,charge){const pid=Number(document.getElementById('p'+id).value);if(!pid)return;const r=await db.rpc('ft_banker_issue_property',{p_banker_token:bankerToken,p_property_id:id,p_player_id:pid,p_charge_player:charge});message.textContent=r.error?r.error.message:(charge?'Property issued and player charged.':'Property awarded by Banker.');if(!r.error)load()}load();setInterval(load,5000);</script></body></html>
