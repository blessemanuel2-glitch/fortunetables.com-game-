<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fortune Tables Properties</title><link rel="stylesheet" href="style.css"><style>.wide{width:min(1000px,100%)}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.prop{border:1px solid #59491e;background:#080808;margin:12px 0;text-align:left;display:grid;grid-template-columns:150px 1fr auto;gap:14px;align-items:center;overflow:hidden}.pic{height:120px;display:flex;align-items:center;justify-content:center;font-size:56px;background:linear-gradient(135deg,#17120a,#080808);border-right:1px solid #59491e}.available{border-color:#d4af37}.gold{color:#d4af37}.pink{color:#ff2d7a}.small{font-size:12px}.actions{padding-right:12px;min-width:180px}.requests{border:1px solid #ff2d7a;padding:14px;margin:12px 0;text-align:left}@media(max-width:650px){.prop{grid-template-columns:90px 1fr}.pic{height:100%;font-size:38px}.actions{grid-column:1/3;padding:0 12px 12px}}</style></head><body><main class="landing"><div class="crown">♛</div><h1 style="font-size:48px">FORTUNE</h1><h2>PROPERTY LIST</h2><p class="tagline">SEE IT. REQUEST IT. BANKER CLOSES THE DEAL.</p><section class="panel wide"><div id="requests"></div><div class="tabs"><button onclick="filter='sale';render()">FOR SALE</button><button class="secondary" onclick="filter='all';render()">ALL PROPERTIES</button></div><div id="list">Loading properties...</div><p id="message"></p><button class="secondary" onclick="history.back()">BACK</button></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://clxyekczujdcfhfpbnoo.supabase.co','sb_publishable_92NFR3gxbBtioyNE9UFGmw_9c28SVKZ');const bankerToken=localStorage.getItem('ft_banker_token'),playerToken=localStorage.getItem('ft_player_token'),token=bankerToken||playerToken;let data=[],filter='sale',players=[];const icons={Home:'🏠',Club:'🌃',Store:'🛍️',Hotel:'🏨',Business:'🏢',Luxury:'🛥️',Property:'🏛️'};function picture(p){const n=p.property_name.toLowerCase();if(n.includes('palace')||n.includes('manor')||n.includes('villa'))return'🏰';if(n.includes('penthouse')||n.includes('loft')||n.includes('suite'))return'🌆';if(n.includes('jewel')||n.includes('diamond'))return'💎';if(n.includes('restaurant'))return'🍽️';if(n.includes('gallery'))return'🖼️';if(n.includes('label'))return'🎵';if(n.includes('fashion')||n.includes('boutique'))return'🛍️';return icons[p.category]||'🏛️'}async function load(){if(!token){location.href='index.html';return}const r=await db.rpc('ft_get_property_catalog',{p_session_token:token});if(r.error){message.textContent=r.error.message;return}data=r.data||[];if(bankerToken){const [p,q]=await Promise.all([db.rpc('ft_get_banker_state',{p_banker_token:bankerToken}),db.rpc('ft_get_banker_property_requests',{p_banker_token:bankerToken})]);players=p.data||[];renderRequests(q.data||[])}render()}function renderRequests(rs){requests.innerHTML=rs.length?'<h3 class="pink">PROPERTY REQUESTS</h3>'+rs.map(r=>`<div class="requests"><b>${r.player_name}</b> wants <b class="gold">${r.property_name}</b> for ${r.price} TABLES.<br><button onclick="answer(${r.request_id},true)">APPROVE + ISSUE</button> <button class="secondary" onclick="answer(${r.request_id},false)">DECLINE</button></div>`).join(''):''}function render(){const arr=filter==='sale'?data.filter(p=>p.is_for_sale):data;list.innerHTML=arr.map(p=>`<div class="prop ${p.is_for_sale?'available':''}"><div class="pic">${picture(p)}</div><div><div class="small gold">${p.category||'PROPERTY'}</div><b>${p.property_name}</b><div class="small">PRICE ${p.price} TABLES • RENT ${p.rent}</div><div class="${p.is_for_sale?'pink':''}">${p.is_for_sale?'AVAILABLE FROM BANK':'OWNED BY '+p.owner_name}</div></div><div class="actions">${p.is_for_sale&&playerToken&&!bankerToken?`<button onclick="requestBuy(${p.property_id},'${esc(p.property_name)}')">REQUEST TO BUY</button>`:''}${p.is_for_sale&&bankerToken?`<select id="p${p.property_id}">${players.map(x=>`<option value="${x.player_id}">${x.player_name}</option>`).join('')}</select><button onclick="issue(${p.property_id},true)">ISSUE + CHARGE</button><button class="secondary" onclick="issue(${p.property_id},false)">AWARD FREE</button>`:''}</div></div>`).join('')||'<p>No properties in this tab.</p>'}function esc(s){return String(s).replace(/'/g,"\\'")}async function requestBuy(id,name){if(!confirm(`Send the Banker a request to buy ${name}?`))return;const r=await db.rpc('ft_request_bank_property',{p_player_token:playerToken,p_property_id:id});message.textContent=r.error?r.error.message:'REQUEST SENT TO BANKER.'}async function answer(id,ok){const r=await db.rpc('ft_banker_respond_property_request',{p_banker_token:bankerToken,p_request_id:id,p_approve:ok});message.textContent=r.error?r.error.message:(ok?'PROPERTY APPROVED + ISSUED.':'Request declined.');if(!r.error)load()}async function issue(id,charge){const pid=Number(document.getElementById('p'+id).value);if(!pid)return;const r=await db.rpc('ft_banker_issue_property',{p_banker_token:bankerToken,p_property_id:id,p_player_id:pid,p_charge_player:charge});message.textContent=r.error?r.error.message:(charge?'Property issued and player charged.':'Property awarded by Banker.');if(!r.error)load()}load();setInterval(load,5000);</script></body></html>
