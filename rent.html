<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fortune Tables Rent</title><link rel="stylesheet" href="style.css"><style>.wide{width:min(760px,100%)}.rent{border:1px solid #59491e;background:#080808;padding:16px;margin:10px 0;text-align:left;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.gold{color:#d4af37}.pink{color:#ff2d7a}.type{font-size:11px;letter-spacing:.15em}</style></head><body><main class="landing"><div class="crown">♛</div><h1 style="font-size:48px">FORTUNE</h1><h2>PAY RENT</h2><p class="tagline">SETTLE UP AT THE TABLE.</p><section class="panel wide"><div id="rentList">Loading rent list...</div><p id="message"></p><button class="secondary" onclick="location.href='player.html'">BACK TO MY FORTUNE</button></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://clxyekczujdcfhfpbnoo.supabase.co','sb_publishable_92NFR3gxbBtioyNE9UFGmw_9c28SVKZ');const token=localStorage.getItem('ft_player_token');async function load(){if(!token){location.href='index.html';return}const {data,error}=await db.rpc('ft_get_rent_properties',{p_player_token:token});if(error){message.textContent=error.message;return}rentList.innerHTML=(data||[]).map(p=>`<div class="rent"><div><div class="type gold">${p.category||'PROPERTY'}</div><b>${p.property_name}</b><p>Owner: ${p.owner_name}<br><span class="pink">RENT: ${p.rent} TABLES</span></p></div><button onclick="pay(${p.property_id},'${esc(p.property_name)}',${p.rent},'${esc(p.owner_name)}')">PAY RENT</button></div>`).join('')||'<p>No rent payments available right now.</p>'}function esc(s){return String(s).replace(/'/g,"\\'")}async function pay(id,name,rent,owner){if(!confirm(`Pay ${rent} TABLES rent to ${owner} for ${name}?`))return;const {data,error}=await db.rpc('ft_pay_property_rent',{p_player_token:token,p_property_id:id});message.textContent=error?error.message:`RENT PAID • ${data?.[0]?.rent_paid??rent} TABLES sent to ${owner}.`;if(!error)load()}load();setInterval(load,5000);</script></body></html>
