<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fortune Tables Voice Chat</title><link rel="stylesheet" href="style.css"><style>*{box-sizing:border-box}body{margin:0;background:#020202;color:#fff}.wrap{width:min(760px,100%);margin:auto;padding:20px}.panel{border:1px solid #59491e;background:#070707;border-radius:16px;padding:20px;box-shadow:0 0 40px #ff2d7a18}.brand{font-family:Georgia,serif;color:#d4af37;font-size:34px}.brand span{color:#ff2d7a}.status{border:1px solid #ff2d7a;padding:12px;border-radius:10px;margin:14px 0;background:#16060c}.members{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}.member{border:1px solid #59491e;background:#0b0905;padding:12px;border-radius:10px;text-align:center}.member.me{border-color:#ff2d7a}.avatar{font-size:34px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}.join{grid-column:1/-1;font-size:20px;min-height:54px}.muted{background:#7b102e}.small{font-size:12px;opacity:.7}.pink{color:#ff2d7a}.gold{color:#d4af37}audio{display:none}@media(max-width:600px){.controls{grid-template-columns:1fr}.join{grid-column:auto}}</style></head><body><main class="wrap"><section class="panel"><div class="brand">FORTUNE <span>VOICE</span></div><p>Same game code. Same voice room.</p><div id="status" class="status">Tap JOIN VOICE CHAT to turn on your microphone.</div><div id="members" class="members"><div class="member">Nobody connected yet.</div></div><div class="controls"><button id="joinBtn" class="join" onclick="joinVoice()">🎤 JOIN VOICE CHAT</button><button id="muteBtn" class="secondary" onclick="toggleMute()" disabled>🔇 MUTE</button><button id="leaveBtn" class="secondary" onclick="leaveVoice()" disabled>LEAVE VOICE</button></div><p class="small">Your browser will ask for microphone permission. Voice works best in Safari/Chrome over HTTPS. Some networks may block peer-to-peer audio.</p><button class="secondary" onclick="history.back()">BACK TO GAME</button><div id="audioMount"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://clxyekczujdcfhfpbnoo.supabase.co','sb_publishable_92NFR3gxbBtioyNE9UFGmw_9c28SVKZ');const playerToken=localStorage.getItem('ft_player_token'),bankerToken=localStorage.getItem('ft_banker_token'),token=playerToken||bankerToken;let stream=null,myKey=null,myName=null,joined=false,muted=false,lastSignalId=0;const peers=new Map();const names=new Map();const rtc={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]};if(!token)location.href='index.html';async function joinVoice(){try{stream=await navigator.mediaDevices.getUserMedia({audio:true,video:false})}catch(e){status.textContent='MICROPHONE ACCESS WAS NOT ALLOWED.';return}const {data,error}=await db.rpc('ft_voice_join',{p_session_token:token});if(error){status.textContent=error.message;return}const me=Array.isArray(data)?data[0]:data;myKey=me.participant_key;myName=me.display_name;joined=true;joinBtn.disabled=true;muteBtn.disabled=false;leaveBtn.disabled=false;status.textContent='🟢 YOU ARE LIVE IN FORTUNE VOICE.';await syncParticipants();pollSignals();heartbeat()}function makePeer(key){if(peers.has(key))return peers.get(key);const pc=new RTCPeerConnection(rtc);stream?.getTracks().forEach(t=>pc.addTrack(t,stream));pc.onicecandidate=e=>{if(e.candidate)sendSignal(key,{type:'ice',candidate:e.candidate})};pc.ontrack=e=>{let a=document.getElementById('audio_'+safe(key));if(!a){a=document.createElement('audio');a.id='audio_'+safe(key);a.autoplay=true;a.playsInline=true;audioMount.appendChild(a)}a.srcObject=e.streams[0]};pc.onconnectionstatechange=()=>{if(['failed','closed','disconnected'].includes(pc.connectionState)){setTimeout(()=>{if(peers.get(key)===pc){peers.delete(key);pc.close()}},1500)}};peers.set(key,pc);return pc}async function createOffer(key){const pc=makePeer(key);if(pc.signalingState!=='stable')return;const offer=await pc.createOffer();await pc.setLocalDescription(offer);await sendSignal(key,{type:'offer',sdp:pc.localDescription})}async function sendSignal(key,payload){await db.rpc('ft_voice_send_signal',{p_session_token:token,p_receiver_key:key,p_payload:payload})}async function pollSignals(){if(!joined)return;const {data}=await db.rpc('ft_voice_get_signals',{p_session_token:token,p_after_id:lastSignalId});for(const s of data||[]){lastSignalId=Math.max(lastSignalId,s.id);await handleSignal(s.sender_key,s.payload)}setTimeout(pollSignals,700)}async function handleSignal(from,p){const pc=makePeer(from);try{if(p.type==='offer'){await pc.setRemoteDescription(new RTCSessionDescription(p.sdp));const ans=await pc.createAnswer();await pc.setLocalDescription(ans);await sendSignal(from,{type:'answer',sdp:pc.localDescription})}else if(p.type==='answer'){if(pc.signalingState==='have-local-offer')await pc.setRemoteDescription(new RTCSessionDescription(p.sdp))}else if(p.type==='ice'&&p.candidate){await pc.addIceCandidate(new RTCIceCandidate(p.candidate))}}catch(e){console.log('voice signal',e)}}async function syncParticipants(){if(!joined)return;const {data}=await db.rpc('ft_voice_list',{p_session_token:token});const rows=data||[];rows.forEach(r=>names.set(r.participant_key,r.display_name));members.innerHTML=rows.map(r=>`<div class="member ${r.participant_key===myKey?'me':''}"><div class="avatar">${r.participant_key==='banker'?'♛':'🎤'}</div><b>${esc(r.display_name)}</b><br><span class="${r.participant_key===myKey?'pink':'gold'}">${r.participant_key===myKey?'YOU':'CONNECTED'}</span></div>`).join('')||'<div class="member">Nobody connected yet.</div>';for(const r of rows){if(r.participant_key!==myKey&&!peers.has(r.participant_key)&&myKey<r.participant_key)createOffer(r.participant_key)}for(const [k,pc] of peers){if(!rows.some(r=>r.participant_key===k)){pc.close();peers.delete(k);document.getElementById('audio_'+safe(k))?.remove()}}setTimeout(syncParticipants,1800)}async function heartbeat(){if(!joined)return;await db.rpc('ft_voice_heartbeat',{p_session_token:token});setTimeout(heartbeat,5000)}function toggleMute(){if(!stream)return;muted=!muted;stream.getAudioTracks().forEach(t=>t.enabled=!muted);muteBtn.textContent=muted?'🎤 UNMUTE':'🔇 MUTE';muteBtn.classList.toggle('muted',muted);status.textContent=muted?'🔇 YOU ARE MUTED.':'🟢 YOU ARE LIVE IN FORTUNE VOICE.'}async function leaveVoice(){joined=false;await db.rpc('ft_voice_leave',{p_session_token:token});peers.forEach(pc=>pc.close());peers.clear();stream?.getTracks().forEach(t=>t.stop());stream=null;joinBtn.disabled=false;muteBtn.disabled=true;leaveBtn.disabled=true;members.innerHTML='<div class="member">You left the voice room.</div>';status.textContent='VOICE CHAT DISCONNECTED.'}window.addEventListener('beforeunload',()=>{if(joined)navigator.sendBeacon?.('')});function safe(s){return String(s).replace(/[^a-z0-9]/gi,'_')}function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}</script></body></html>
